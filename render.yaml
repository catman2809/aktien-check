services:
  - type: web
    name: aktien-check
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python aktien_check.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MALLOC_ARENA_MAX   # weniger Speicherbereiche pro Thread -> weniger Arbeitsspeicher (glibc)
        value: "2"
      - key: APP_PASSWORD
        sync: false

function etfSection(d) {
  const E = d.etf || {}, I = E.issuer;
  const top = I ? I.holdings.slice(0, 10).map(h => ({symbol: /^[A-Z]{2}[A-Z0-9]{9}\d$/.test(h[4]) ? h[4] : h[0], name: h[0], weight: h[1]})) : (E.top || []);
  const sec = I && I.sectors.length ? I.sectors : (E.sectors || []), rat = E.ratings || [];
  const ctry = I ? I.countries : [];
  ETF_LIST = {rows: I ? I.holdings : [], q: "", all: false};
  const AC = [["Aktien", "var(--inc-rev)"], ["Anleihen", "var(--inc-ni)"], ["Cash", "var(--text-3)"], ["Sonstiges", "var(--inc-mar)"]];
  const assets = AC.map(([k, c]) => ({name: k, color: c, w: (E.assets || {})[k] || 0})).filter(x => x.w >= 0.0005);
  const srcNote = I ? `Bestände von ${I.url ? `<a href="${esc(I.url)}" target="_blank" rel="noopener">${esc(I.source)}</a>` : esc(I.source)}${I.asof ? ", Stand " + esc(I.asof) : ""} · ${nf(I.total, 0)} Positionen${I.delayed ? " · Quartalsmeldung an die US-Aufsicht, bis zu drei Monate alt" : ""}`
    : "Quelle: Yahoo Finance (nur die größten Positionen)";
  const head = `<h2 class="section" id="konkurrenz">Zusammensetzung</h2>
    <p class="section-sub">Woraus der ETF besteht: Anlageklassen, ${ctry.length ? "Länder, " : ""}Branchen${I ? " und alle Positionen" : " und größte Positionen"}${E.bond ? ", Bonität der Anleihen" : ""}. ${srcNote}${I && I.source === "Vanguard" ? " (Vanguard veröffentlicht keine Länder je Position)" : ""}.</p>
    ${I && I.synthetic ? `<div class="note" style="margin-bottom:12px"><b>Synthetischer ETF (Swap):</b> Die Bestände sind ein Trägerportfolio, das der Anbieter als Sicherheit hält. Die Wertentwicklung kommt über einen Tauschvertrag (Swap) vom Index – Länder und Branchen unten entsprechen daher nicht dem Index.</div>` : ""}`;
  if (!top.length && !sec.length && !assets.length && !rat.length) return head + `<div class="card empty">Die Zusammensetzung war nicht abrufbar.</div>`;
  const maxT = Math.max(...top.map(x => x.weight), 0.01), maxS = Math.max(...sec.map(x => x.weight), 0.01), maxR = Math.max(...rat.map(x => x.weight), 0.01);
  const maxC = Math.max(...ctry.map(x => x.weight), 0.01);
  const bar = (w, max) => `<span class="etf-bar"><i style="width:${Math.max(2, w / max * 100)}%"></i></span>`;
  const row = (name, w, max) => `<div class="etf-row"><span class="etf-name">${name}</span>${bar(w, max)}<span class="num etf-w">${pc(w, 1)}</span></div>`;
  const stack = (parts, label) => `<div class="etf-stack" role="img" aria-label="${esc(label)}">${parts.map(p_ =>
      `<i style="width:${p_.w * 100}%;background:${p_.color}" title="${esc(p_.name)}: ${pc(p_.w, 1)}"></i>`).join("")}</div>
    <div class="etf-legend">${parts.map(p_ => `<span><b style="background:${p_.color}"></b>${esc(p_.name)} <span class="num">${pc(p_.w, 1)}</span></span>`).join("")}</div>`;
  const topSum = top.reduce((a, x) => a + x.weight, 0);
  const topLab = top.length === 1 ? "Größte Position" : `Top ${top.length} Positionen`;
  const assetsCard = assets.length ? `<div class="card pad etf-wide"><h3>Anlageklassen</h3>${stack(assets, "Aufteilung nach Anlageklassen")}
    ${top.length ? `<div class="stamp" style="margin:12px 0 4px">Konzentration: ${top.length === 1 ? "Die größte Position macht" : `Die ${top.length} größten Positionen machen`} ${pc(topSum, 1)} aus${topSum < 0.98 ? `, die übrigen Positionen ${pc(1 - topSum, 1)}` : ""}.</div>
      ${stack([{name: top.length === 1 ? "größte Position" : `Top ${top.length}`, w: Math.min(1, topSum), color: "var(--accent)"}, {name: "übrige Positionen", w: Math.max(0, 1 - topSum), color: "var(--track)"}], "Anteil der größten Positionen")}` : ""}
    ${E.pe || E.pb ? `<div class="etf-kv">${E.pe ? `<span>KGV der Bestände <b class="num">${nf(E.pe, 1)}</b></span>` : ""}${E.pb ? `<span>Kurs-Buchwert <b class="num">${nf(E.pb, 2)}</b></span>` : ""}</div>` : ""}</div>` : "";
  const bondCard = E.bond && (rat.length || E.duration) ? `<div class="card pad"><h3>Anleihen: Bonität & Laufzeit</h3>
    ${rat.map(x => row(esc(x.name), x.weight, maxR)).join("")}
    <div class="etf-kv">${E.duration != null ? `<span>Duration <b class="num">${nf(E.duration, 1)} J.</b></span>` : ""}${E.maturity != null ? `<span>Ø Restlaufzeit <b class="num">${nf(E.maturity, 1)} J.</b></span>` : ""}${E.gov_share ? `<span>Staatsanleihen <b class="num">${pc(E.gov_share, 0)}</b></span>` : ""}</div>
    <div class="stamp" style="margin-top:6px">Duration = wie stark der Kurs auf Zinsänderungen reagiert: etwa −${E.duration != null ? nf(E.duration, 1) : "x"} % je Prozentpunkt Zinsanstieg.</div></div>` : "";
  return head + `<div class="etf-grid">
    ${assetsCard}
    ${top.length ? `<div class="card pad"><h3>${topLab}</h3>${top.map(x => row(`<a href="?q=${encodeURIComponent(x.symbol)}" data-q="${esc(x.symbol)}" class="etf-link">${esc(x.name)}</a>`, x.weight, maxT)).join("")}
      <div class="stamp" style="margin-top:8px">Zusammen ${pc(topSum, 1)} des Fonds · Name antippen für die Einzelanalyse</div></div>` : ""}
    ${ctry.length ? `<div class="card pad"><h3>Länder</h3>${ctry.map(x => row(esc(x.name), x.weight, maxC)).join("")}
      <div class="stamp" style="margin-top:8px">Sitzland laut ${esc(I.source)}</div></div>` : ""}
    ${sec.length ? `<div class="card pad"><h3>Branchen</h3>${sec.map(x => row(esc(x.name), x.weight, maxS)).join("")}</div>` : ""}
    ${bondCard}
    ${I && I.holdings.length ? `<div class="card pad etf-wide"><h3>Alle Positionen <span class="stamp">${I.holdings.length < I.total ? `die größten ${nf(I.holdings.length, 0)} von ${nf(I.total, 0)}` : nf(I.total, 0)}</span></h3>
      <input id="etf-q" class="etf-search" type="search" placeholder="Position, Land oder Branche suchen …" autocomplete="off">
      <div class="peer-scroll" id="etf-list">${etfListHtml()}</div></div>` : ""}
  </div>`;
}

function peersSection(d) {
  if (d.asset === "crypto") return cryptoPeersSection(d);
  if (d.asset === "etf") return etfSection(d);
  const C = d.competitors || {};
  const peers = C.peers || [], own = C.own || {}, S = C.summary || {};
  const head = `<h2 class="section" id="konkurrenz">Konkurrenzvergleich</h2>
    <p class="section-sub">${peers.length ? `${peers.length} Wettbewerber${C.industry ? " aus der Branche „" + esc(C.industry) + "“" : ""} im Vergleich. Zeile antippen, um den Wettbewerber zu analysieren.` : "Vergleich mit Unternehmen derselben Branche."}</p>`;
  if (!peers.length) return head + `<div class="card empty">Für diese Aktie konnten keine vergleichbaren Wettbewerber ermittelt werden.</div>`;
  const pcf = v => v == null ? "–" : `<span class="${v < 0 ? "neg" : ""}">${pc(v, 1)}</span>`;
  const kgv = v => v == null ? "–" : nf(v, 1);
  const cap = (v, cur) => { if (v == null) return "–"; const [n, u] = big(v); return `${n} ${u}<small>${esc(cur || "")}</small>`; };
  const verdict = (key, label, lowBetter) => {
    const x = S[key] || {}, ov = own[key];
    if (ov == null || !x.n) return `<div><dt>${label}</dt><dd>–</dd><small style="color:var(--text-3)">keine Vergleichsdaten</small></div>`;
    const good = x.beats >= Math.ceil(x.n / 2);
    const word = lowBetter ? (good ? "günstiger" : "teurer") : (good ? "höher" : "niedriger");
    const fmt = key === "pe" ? kgv : v => pc(v, 1);
    return `<div><dt>${label}</dt><dd class="num">${fmt(ov)} <span class="stamp">vs. Median ${fmt(x.median)}</span></dd>
      <small style="color:${good ? "var(--pos)" : "var(--neg)"}">${word} als ${x.beats} von ${x.n} Wettbewerbern</small></div>`;
  };
  const row = (r, cls) => `<tr class="${cls}" ${cls === "peer" ? `data-s="${esc(r.symbol)}"` : ""}>
      <td>${esc(r.name || r.symbol)}<small>${esc(r.symbol)}${cls === "own" ? " · diese Aktie" : ""}</small></td>
      <td>${cap(r.mcap, r.currency)}</td><td>${kgv(r.pe)}</td><td>${pcf(r.op_m)}</td><td>${pcf(r.growth)}</td></tr>`;
  return head + `<div class="card peer-card">
    <dl class="peer-sum" style="margin:0">${verdict("pe", "KGV", true)}${verdict("op_m", "Operative Marge", false)}${verdict("growth", "Umsatzwachstum", false)}</dl>
    <div class="peer-scroll"><table class="peers">
      <thead><tr><th>Unternehmen</th><th>Börsenwert</th><th>KGV</th><th>Op. Marge</th><th>Wachstum</th></tr></thead>
      <tbody>${row(own, "own")}${peers.map(r => row(r, "peer")).join("")}
        <tr class="med"><td>Median Wettbewerber</td><td></td><td>${kgv(S.pe?.median)}</td><td>${S.op_m?.median == null ? "–" : pc(S.op_m.median, 1)}</td><td>${S.growth?.median == null ? "–" : pc(S.growth.median, 1)}</td></tr>
      </tbody></table></div>
    <div class="peer-foot">Quelle: ${esc(C.source || "–")}. KGV auf Basis der letzten 12 Monate (bei Verlust nicht aussagekräftig, daher „–“);
      Wachstum = Umsatz ggü. Vorjahr. Wettbewerber stammen überwiegend von US-Börsen. ${S.pe?.n >= 3 ? "Die Bewertung nutzt den KGV-Median der Wettbewerber als Vergleichsmaßstab." : ""}</div>
  </div>`;
}

/* PDF-Export über die Druckfunktion des Browsers (Drucklayout siehe @media print) */
function exportPdf(d) {
  const old = document.title;
  const date = new Date().toLocaleDateString("de-DE");
  document.title = `Stocky ${d.name} ${date}`.replace(/[\\/:*?"<>|]/g, "");  // wird zum Dateinamen
  const restore = () => { document.title = old; window.removeEventListener("afterprint", restore); };
  window.addEventListener("afterprint", restore);
  if (isStandalone() && /iPhone|iPad/.test(navigator.userAgent)) {
    toast("Tipp: Im Druckdialog auf „Teilen“ → „In Dateien sichern“ tippen");
  }
  setTimeout(() => { window.print(); setTimeout(restore, 1500); }, 50);
}

      <li>Risiko ist bei Kryptowährungen grundsätzlich höchstens „neutral“. Coins außerhalb der Top 50: höchstens „Halten“. Stablecoins: immer „Neutral“.</li>
      <li>Stimmung: Crypto Fear &amp; Greed Index und News-Tonalität. Dividende: nicht anwendbar (0 % Gewicht).</li>`

        keine Finanzanalyse im Sinne des Wertpapierhandelsgesetzes und keine Aufforderung zum Kauf oder Verkauf von Wertpapieren dar.</p>
      <p>Die Daten können verzögert, unvollständig oder fehlerhaft sein. Deine persönliche finanzielle Situation, Ziele und Risikobereitschaft

/* Menüpunkte in der Reihenfolge anordnen, in der die Abschnitte auf der Seite stehen */
function sortSubnav() {
  const box = $("#subnav .container"), sym = $("#navsym");
  const links = [...box.querySelectorAll('a[href^="#"]')];
  const target = a => document.getElementById(a.getAttribute("href").slice(1));
  links.sort((x, y) => {
    const ex = target(x), ey = target(y);
    if (!ex || !ey) return ex ? -1 : ey ? 1 : 0;  // fehlende Abschnitte ans Ende
    return ex.compareDocumentPosition(ey) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
  });
  links.forEach(a => box.insertBefore(a, sym));
}

if (location.protocol === "file:") {

} else {

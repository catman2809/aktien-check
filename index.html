<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aktien-Check">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f4fd8">
<title>Aktien-Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f8f9fb; --border:#e4e7ec; --border-strong:#d0d5dd;
  --text:#101828; --text-2:#475467; --text-3:#98a2b3;
  --accent:#1f4fd8; --accent-soft:#eef3ff;
  --pos:#067647; --pos-soft:#ecfdf3; --pos-line:#abefc6;
  --neu:#b54708; --neu-soft:#fffaeb; --neu-line:#fedf89;
  --neg:#b42318; --neg-soft:#fef3f2; --neg-line:#fecdca;
  --track:#eaecf0; --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --sma50:#eb6834; --sma200:#6250d6;
  --inc-rev:#2f6bdb; --inc-ni:#1f9e9e; --inc-mar:#eb6834;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c111d; --surface:#131a2a; --surface-2:#182033; --border:#232c3f; --border-strong:#334056;
    --text:#f2f4f7; --text-2:#b4bccb; --text-3:#7a859a;
    --accent:#7c9cff; --accent-soft:#1a2547;
    --pos:#47cd89; --pos-soft:#0f2a1e; --pos-line:#1d5c3e;
    --neu:#fdb022; --neu-soft:#2d230f; --neu-line:#5c4514;
    --neg:#f97066; --neg-soft:#2f1414; --neg-line:#6b2621;
    --track:#232c3f; --shadow:none;
    --sma50:#d95926; --sma200:#9085e9;
    --inc-rev:#5a82e8; --inc-ni:#2ba3a3; --inc-mar:#d95926;
  }
}
:root[data-theme="dark"]{
  --bg:#0c111d; --surface:#131a2a; --surface-2:#182033; --border:#232c3f; --border-strong:#334056;
  --text:#f2f4f7; --text-2:#b4bccb; --text-3:#7a859a;
  --accent:#7c9cff; --accent-soft:#1a2547;
  --pos:#47cd89; --pos-soft:#0f2a1e; --pos-line:#1d5c3e;
  --neu:#fdb022; --neu-soft:#2d230f; --neu-line:#5c4514;
  --neg:#f97066; --neg-soft:#2f1414; --neg-line:#6b2621;
  --track:#232c3f; --shadow:none;
  --sma50:#d95926; --sma200:#9085e9;
  --inc-rev:#5a82e8; --inc-ni:#2ba3a3; --inc-mar:#d95926;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 16px}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.topbar .container{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
a.brand{color:inherit;text-decoration:none;border-radius:10px}
a.brand:hover .logo{filter:brightness(1.12)}
a.brand:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.home-btn{display:inline-flex;align-items:center;gap:4px;flex:none;height:32px;padding:0 12px 0 8px;margin-right:6px;
  border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;
  font-weight:600;cursor:pointer}
.home-btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
@media (max-width:640px){.home-btn span{display:none}.home-btn{padding:0 8px}}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--text-3);letter-spacing:.02em;margin-top:-3px}
.search{position:relative;flex:1;min-width:0;max-width:560px;margin-left:auto;display:flex}
.search input{flex:1;min-width:0;width:100%;height:40px;padding:0 14px 0 38px;border:1px solid var(--border-strong);border-right:0;
  border-radius:10px 0 0 10px;background:var(--surface);color:var(--text);font:inherit;font-size:14.5px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg.s{position:absolute;left:12px;top:12px;color:var(--text-3)}
.search button{height:40px;padding:0 18px;border:0;border-radius:0 10px 10px 0;background:var(--accent);color:#fff;
  font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.search button:hover{filter:brightness(1.07)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);cursor:pointer;display:grid;place-items:center;flex:none}
.suggest{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:0 12px 24px rgba(16,24,40,.12);overflow:hidden;display:none}
.suggest div{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:14px}
.suggest div+div{border-top:1px solid var(--border)}
.suggest div:hover,.suggest div.act{background:var(--surface-2)}
.suggest small{color:var(--text-3);white-space:nowrap}

/* ---------- Section nav ---------- */
.subnav{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:15;display:none}
.subnav .container{display:flex;gap:4px;overflow-x:auto;height:46px;align-items:center;scrollbar-width:none}
.subnav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--text-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.subnav a:hover{background:var(--surface-2);color:var(--text)}
.subnav .sym{margin-left:auto;font-size:13px;color:var(--text-3);white-space:nowrap}

main{padding:28px 0 72px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:22px 24px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
h2.section{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:44px 0 4px}
p.section-sub{margin:0 0 16px;color:var(--text-2);font-size:14px}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}
@media (max-width:960px){.hero{grid-template-columns:1fr}}
.co-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.co-name{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.price-box{text-align:right}
.price{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.price small{font-size:15px;font-weight:600;color:var(--text-2);margin-left:4px}
.delta{font-size:13px;font-weight:600;margin-top:4px}
.biz{color:var(--text-2);font-size:14px;margin:18px 0 0;line-height:1.65}
.biz.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px}
.alts{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.alts button{font:inherit;font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer}
.alts button:hover{border-color:var(--accent);color:var(--accent)}

.verdict{display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.verdict::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--tone)}
.verdict.pos{--tone:var(--pos);--tone-soft:var(--pos-soft)} .verdict.neu{--tone:var(--neu);--tone-soft:var(--neu-soft)} .verdict.neg{--tone:var(--neg);--tone-soft:var(--neg-soft)}
.v-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;background:var(--tone-soft);color:var(--tone)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.v-label{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--tone);margin-top:10px}
.v-score{text-align:right}
.v-score b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.v-score span{font-size:12px;color:var(--text-3)}
.scale{position:relative}
.scale-bar{display:grid;grid-template-columns:repeat(14,1fr);gap:2px}
.scale-bar i{height:8px;display:block;opacity:.22}
.scale-bar i:first-child{border-radius:4px 0 0 4px} .scale-bar i:last-child{border-radius:0 4px 4px 0}
.scale-bar i.p{background:var(--pos)} .scale-bar i.n{background:var(--neu)} .scale-bar i.x{background:var(--neg)}
.scale-bar i.on{opacity:1}
.scale-marker{position:absolute;top:-5px;width:2px;height:18px;background:var(--text);border-radius:1px;transform:translateX(-1px)}
.scale-groups{display:grid;grid-template-columns:5fr 4fr 5fr;margin-top:8px;font-size:11.5px;color:var(--text-3);font-weight:500}
.scale-groups span:nth-child(2){text-align:center} .scale-groups span:nth-child(3){text-align:right}
.v-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.v-meta div{background:var(--surface);padding:10px 12px}
.v-meta dt{font-size:11.5px;color:var(--text-3);font-weight:500}
.v-meta dd{margin:0;font-weight:600;font-size:15px}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--neu-soft);color:var(--neu);border:1px solid var(--neu-line)}
.stamp{font-size:12px;color:var(--text-3)}

/* ---------- Key facts ---------- */
.facts{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);overflow:hidden;margin:16px 0 0}
.facts div{padding:16px 18px;background:var(--surface)}
@media (max-width:1100px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts dt{font-size:12px;color:var(--text-3);font-weight:500}
.facts dd{margin:3px 0 0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.facts dd small{font-size:12px;color:var(--text-3);font-weight:500;margin-left:4px}

/* ---------- Overview ---------- */
.overview{overflow:hidden}
.ov-row{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(150px,1.3fr) minmax(120px,1fr) 52px;gap:16px;align-items:center;
  padding:13px 24px;border-top:1px solid var(--border);text-decoration:none}
.ov-row:first-child{border-top:0}
.ov-row:hover{background:var(--surface-2)}
.ov-cat{font-size:14px;color:var(--text-2)}
.ov-adj{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.ov-w{font-size:12px;color:var(--text-3);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--text-3)}
.dot.pos{background:var(--pos)} .dot.neu{background:var(--neu)} .dot.neg{background:var(--neg)}
@media (max-width:640px){.ov-row{grid-template-columns:1fr 1fr;padding:12px 16px}.ov-row .meter{grid-column:1/-1}.ov-w{display:none}}
.meter{position:relative;height:6px;background:var(--track);border-radius:3px}
.meter i{position:absolute;top:0;bottom:0;border-radius:3px}
.meter::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border-strong)}
.meter i.pos{background:var(--pos)} .meter i.neu{background:var(--neu)} .meter i.neg{background:var(--neg)}

/* ---------- Category details ---------- */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.cats{grid-template-columns:1fr}}
.cat{display:flex;flex-direction:column}
.cat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cat-adj{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:4px 0 0;line-height:1.25}
.tone{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tone.pos{background:var(--pos-soft);color:var(--pos)} .tone.neu{background:var(--neu-soft);color:var(--neu)} .tone.neg{background:var(--neg-soft);color:var(--neg)}
.cat .meter{margin:16px 0 4px}
.meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3)}
.reasons{list-style:none;margin:16px 0 0;padding:0;font-size:13.5px;color:var(--text-2)}
.reasons li{padding:7px 0;border-top:1px dashed var(--border);display:flex;gap:10px}
.reasons li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--text-3);margin-top:9px;flex:none}
.options{margin-top:auto;padding-top:16px}
.options .lbl{font-size:11.5px;color:var(--text-3);margin-bottom:6px}
.opt{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin:0 4px 4px 0;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border)}
.opt.sel{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600}
.cat-foot{font-size:12px;color:var(--text-3);margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between}

/* ---------- Fundamentals ---------- */
.fund{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.fund{grid-template-columns:1fr}}
.fund h3{font-size:14.5px;font-weight:600;margin:0;padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.fund h3 span{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.frow{display:flex;justify-content:space-between;gap:16px;padding:11px 20px;border-top:1px solid var(--border);font-size:13.5px}
.frow:first-child{border-top:0}
.fk{color:var(--text-2);min-width:0}
.fh{color:var(--text-3);font-size:12px;margin-top:2px}
.fv{font-weight:600;text-align:right;flex:none;max-width:55%;overflow-wrap:anywhere}
.wtable{width:100%;border-collapse:collapse;font-size:13.5px}

/* ---------- News ---------- */
.news-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--border)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--text-2);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.seg button em{font-style:normal;color:var(--text-3);margin-left:4px;font-weight:500}
@media (max-width:640px){#ch-seg{display:grid;grid-template-columns:repeat(6,1fr);width:100%}
  #ch-seg button{padding:6px 0;font-size:12.5px;white-space:nowrap}}
.sent{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-2)}
.sent-bar{width:120px;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:flex}
.sent-bar i{display:block;height:100%}
.tier-desc{font-size:12.5px;color:var(--text-3);padding:12px 20px 0}
.nlist{list-style:none;margin:0;padding:4px 0 8px}
.nlist li{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--border)}
.nlist li:first-child{border-top:0}
.nlist .dot{margin-top:8px}
.nlist a{text-decoration:none;font-weight:500;font-size:14.5px;line-height:1.45}
.nlist a:hover{color:var(--accent)}
.nmeta{font-size:12px;color:var(--text-3);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px}
.badge.ok{background:var(--pos-soft);color:var(--pos)} .badge.no{background:var(--neu-soft);color:var(--neu)}
.news-foot{font-size:12.5px;color:var(--text-3);padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.empty{padding:28px 20px;color:var(--text-3);font-size:14px;text-align:center}

/* ---------- Method ---------- */
.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.method{grid-template-columns:1fr}}
.method h3{font-size:14.5px;margin:0 0 10px}
.method p,.method li{font-size:13.5px;color:var(--text-2)}
.method ul{margin:0;padding-left:18px}
.wtable td{padding:6px 0;border-top:1px solid var(--border)} .wtable td:last-child{text-align:right;font-weight:600}
.wtable tr:first-child td{border-top:0}
.scale-list{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.scale-list span:nth-child(odd){color:var(--text-3);text-align:right}
.disclaimer{margin-top:28px;font-size:12.5px;color:var(--text-3);line-height:1.7;border-top:1px solid var(--border);padding-top:18px}

/* ---------- Watchlist ---------- */
.icon-btn{position:relative}
.badge-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.watch-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.wl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
.wl-head h1{font-size:24px;letter-spacing:-.02em;margin:0}
.wl-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wl-actions select{height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:13.5px;padding:0 10px}
.wl-row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.1fr) minmax(0,1.3fr) 64px minmax(0,1.1fr) minmax(0,1fr) 72px;
  gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--border);cursor:pointer}
.wl-row:first-child{border-top:0}
.wl-row:hover{background:var(--surface-2)}
.wl-row.head{cursor:default;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding-top:12px;padding-bottom:12px}
.wl-row.head:hover{background:none}
.wl-name{min-width:0} .wl-name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-name small{color:var(--text-3);font-size:12px}
.wl-price{font-weight:600} .wl-price small{display:block;font-size:12px;font-weight:500}
.wl-score{font-weight:700;text-align:right}
.wl-time{font-size:12px;color:var(--text-3)}
.x-btn{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--text-3);cursor:pointer;font-size:20px;line-height:1}

.modal-bg{position:fixed;inset:0;background:rgba(12,17,29,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modal{width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto}
.modal h3{margin:0;font-size:18px}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .in{display:flex;align-items:center;gap:8px}
.field input[type=number]{flex:1;min-width:0;height:42px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);padding:0 12px;font:inherit;font-size:16px}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .unit{color:var(--text-3);font-size:13px;width:40px}
.field small{display:block;color:var(--text-3);font-size:12px;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.btn.danger{color:var(--neg)}
.state-line{font-size:12.5px;color:var(--text-3);margin-top:6px}
.state-line b{color:var(--neu)}
.push-card{margin-top:16px}
.push-card h3{margin:0 0 4px;font-size:16px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px}
.status.ok{background:var(--pos-soft);color:var(--pos)} .status.warn{background:var(--neu-soft);color:var(--neu)}
.steps-list{margin:14px 0 0;padding-left:20px;font-size:14px;color:var(--text-2)}
.steps-list li{margin:8px 0}
.code{display:flex;gap:8px;margin-top:6px}
.code input{flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  padding:0 10px;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
.alert-list{margin-top:14px;border-top:1px solid var(--border)}
.alert-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;align-items:center}
.alert-item small{display:block;color:var(--text-3);font-size:12px}

/* ---------- Kurschart ---------- */
.chart-card{margin-top:16px;padding:20px 24px 14px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.chart-val{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.chart-val small{font-size:13px;font-weight:600;color:var(--text-2);margin-left:4px}
.chart-chg{font-size:13.5px;font-weight:600;margin-top:2px}
.chart-chg span{color:var(--text-3);font-weight:500;margin-left:4px}
.chart-wrap{position:relative;height:280px;margin-top:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
@media (max-width:640px){.chart-wrap{height:220px}.chart-card{padding:16px 16px 10px}}
.chart-wrap svg{display:block;width:100%;height:100%;overflow:visible}
.chart-wrap .grid line{stroke:var(--border);stroke-width:1}
.chart-wrap .axis text{fill:var(--text-3);font-size:11.5px;font-variant-numeric:tabular-nums}
.chart-wrap .baseline{stroke:var(--text-3);stroke-width:1;stroke-dasharray:3 4}
.chart-wrap .cross{stroke:var(--text-3);stroke-width:1}
.chart-wrap .dot{stroke:var(--surface);stroke-width:2}
.chart-tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(16,24,40,.12);white-space:nowrap;display:none;z-index:2}
.chart-tip b{display:block;font-size:13.5px;font-variant-numeric:tabular-nums}
.chart-tip span{color:var(--text-3)}
.chart-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-3);font-size:14px}
.chart-foot{font-size:11.5px;color:var(--text-3);margin-top:6px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chart-ctrl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle .sw{width:34px;height:20px;border-radius:10px;background:var(--track);position:relative;transition:background .15s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle input:checked + .sw{background:var(--accent)}
.toggle input:checked + .sw::after{transform:translateX(14px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.toggle.disabled{opacity:.45;cursor:default}
.ind-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.chip-btn{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);
  font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip-btn i{width:14px;height:0;border-top:2px solid currentColor;display:inline-block}
.chip-btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.chip-btn[aria-pressed="false"] i{opacity:.35}
.chip-btn:disabled{opacity:.45;cursor:default}
.chip-btn.vol i{height:8px;width:10px;border:0;background:currentColor;opacity:.6}
.chart-wrap .vol rect{fill:var(--text-3);opacity:.35}
.chart-wrap .vol rect.on{opacity:.9}
.chart-wrap .vlabel{fill:var(--text-3);font-size:10.5px}
.chart-wrap .endlbl{font-size:10.5px;font-weight:700}
.inc-wrap{height:260px}
.inc-wrap .col.on rect.bg{fill:var(--surface-2)}
.inc-wrap .zero{stroke:var(--text-3);stroke-width:1}
.legend i.box{width:10px;height:10px;border:0;border-radius:3px;background:currentColor}
.legend i.mar{width:18px;border-top:2px solid currentColor;position:relative}
.legend i.mar::after{content:"";position:absolute;left:5px;top:-5px;width:6px;height:6px;border:2px solid currentColor;border-radius:50%;background:var(--surface)}
.about dl{margin:0}
.about-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 22px;border-top:1px solid var(--border)}
.about-row:first-child{border-top:0}
.about-row dt{color:var(--text-2);font-size:14px}
.about-row dt small{display:block;color:var(--text-3);font-size:11.5px}
.about-row dd{margin:0;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;text-align:right;min-width:0;overflow-wrap:anywhere}
.about-row dd a{color:var(--accent);text-decoration:none}
.about-row dd a:hover{text-decoration:underline}
.about-row .mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.copy-btn{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-3);cursor:pointer}
.copy-btn:hover{color:var(--text);border-color:var(--border-strong)}
.copy-btn.ok{color:var(--pos);border-color:var(--pos-line)}
@media (max-width:640px){.about-row{padding:11px 16px}}
.legend i.mar.op{border-top-style:dashed}
.legend i.mar.op::after{border-radius:1.5px}
.legend i.sma50{color:var(--sma50)} .legend i.sma200{color:var(--sma200)}
@media (max-width:640px){.ind-row{justify-content:flex-start}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid currentColor}
.legend i.dash{border-top-style:dashed}
.legend i.div{width:9px;height:9px;border:2px solid var(--accent);border-radius:50%;background:var(--surface)}
.chart-wrap .divmark{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart-tip .tdiv{display:block;color:var(--accent);font-weight:600;margin-top:2px}
@media (max-width:640px){.chart-ctrl{align-items:flex-start;width:100%}}

/* ---------- Termine ---------- */
.ev-card{margin-top:16px}
.ev-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--border)}
.ev-head h3{margin:0;font-size:15px}
.ev-list{list-style:none;margin:0;padding:0}
.ev-item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 20px;border-top:1px solid var(--border)}
.ev-item:first-child{border-top:0}
.ev-date{text-align:center;border:1px solid var(--border);border-radius:10px;padding:5px 0 6px;line-height:1.1;background:var(--surface-2)}
.ev-date b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.ev-date span{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.ev-title{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev-title .dot{width:8px;height:8px}
.ev-sub{font-size:12.5px;color:var(--text-3);margin-top:2px}
.ev-when{font-size:12.5px;font-weight:600;color:var(--text-2);white-space:nowrap;text-align:right}
.ev-when.soon{color:var(--accent)}
.ev-est{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--neu-soft);color:var(--neu)}
.ev-foot{font-size:12px;color:var(--text-3);padding:12px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.dot.earnings{background:var(--accent)} .dot.exdiv,.dot.pay{background:var(--pos)} .dot.agm{background:var(--neu)}
.wl-ev{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px}
.wl-ev.soon{color:var(--accent);font-weight:600}

/* ---------- Verlauf der Empfehlung ---------- */
.hist-card{margin-top:16px}
.hist-body{padding:16px 20px}
.hist-wrap{position:relative;height:200px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hist-wrap svg{display:block;width:100%;height:100%;overflow:visible}
.hist-wrap .zone-pos{fill:var(--pos-soft)} .hist-wrap .zone-neu{fill:var(--neu-soft)} .hist-wrap .zone-neg{fill:var(--neg-soft)}
.hist-wrap .zlbl{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hist-wrap .axis text{fill:var(--text-3);font-size:11px;font-variant-numeric:tabular-nums}
.hist-wrap .hp{stroke:var(--surface);stroke-width:2}
.hist-changes{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--border)}
.hist-changes li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;flex-wrap:wrap}
.hist-changes .when{color:var(--text-3);font-size:12.5px}
.hist-empty{color:var(--text-2);font-size:14px;line-height:1.6}
.hist-empty b{color:var(--text)}

/* ---------- Konto & Benutzerverwaltung ---------- */
.acct-name{font-size:12px;font-weight:600;color:var(--text-2);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.acct-name{display:none}}
.acct-btn{width:auto;padding:0 10px;gap:6px;display:inline-flex;align-items:center}
.modal.wide{max-width:560px}
.sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.sec h4{margin:0 0 4px;font-size:14.5px}
.field input[type=text],.field input[type=password]{flex:1;min-width:0;height:42px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:16px;width:100%}
.form-msg{font-size:13px;margin-top:8px;min-height:18px}
.form-msg.err{color:var(--neg)} .form-msg.ok{color:var(--pos)}
.user-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.user-row b{font-size:14px}
.user-row small{display:block;color:var(--text-3);font-size:12px}
.user-row .acts{display:flex;gap:6px;flex-wrap:wrap}
.user-row .btn{height:30px;font-size:12.5px;padding:0 10px}
.role{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-left:6px}

/* ---------- Rechtlicher Hinweis ---------- */
.legal{display:flex;gap:14px;margin-top:32px;padding:18px 20px;border-radius:var(--radius);border:1px solid var(--neu-line);
  background:var(--neu-soft);color:var(--text)}
.legal-icon{flex:none;width:26px;height:26px;border-radius:50%;background:var(--neu);color:var(--surface);display:grid;
  place-items:center;font-weight:800;font-size:15px;margin-top:1px}
.legal b{font-size:14.5px}
.legal p{margin:8px 0 0;font-size:13px;line-height:1.65;color:var(--text-2)}
.legal p b{font-size:inherit;color:var(--text)}

/* ---------- Hinweis: zum Startbildschirm hinzufügen ---------- */
.a2hs{display:flex;gap:14px;align-items:flex-start;text-align:left;margin:28px auto 0;max-width:560px;padding:16px 18px;position:relative}
.a2hs img{width:48px;height:48px;border-radius:11px;flex:none}
.a2hs b{display:block;font-size:15px;margin-bottom:2px}
.a2hs p{margin:0;font-size:13.5px;color:var(--text-2);line-height:1.6}
.a2hs ol{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--text-2);line-height:1.7}
.a2hs .share{display:inline-block;vertical-align:-3px}
.a2hs .x-btn{position:absolute;top:6px;right:6px;width:28px;height:28px;font-size:18px}
.a2hs .btn{margin-top:10px}

/* ---------- Konkurrenzvergleich ---------- */
.peer-card{overflow:hidden}
.peer-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.peer-sum div{background:var(--surface);padding:14px 18px}
.peer-sum dt{font-size:12px;color:var(--text-3);font-weight:500}
.peer-sum dd{margin:3px 0 0;font-size:15px;font-weight:600}
.peer-sum small{display:block;font-size:12px;font-weight:500;margin-top:2px}
@media (max-width:640px){.peer-sum{grid-template-columns:1fr}}
.peer-scroll{overflow-x:auto}
table.peers{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
table.peers th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);text-align:right;padding:10px 16px;border-bottom:1px solid var(--border)}
table.peers th:first-child,table.peers td:first-child{text-align:left}
table.peers td{padding:11px 16px;border-top:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
table.peers tr.peer{cursor:pointer}
table.peers tr.peer:hover td{background:var(--surface-2)}
table.peers tr.own td{background:var(--accent-soft);font-weight:600}
table.peers tr.med td{color:var(--text-2);font-style:italic;border-top:2px solid var(--border)}
table.peers td small{display:block;font-size:11.5px;color:var(--text-3);font-weight:500;font-style:normal}
table.peers .neg{color:var(--neg)}
.peer-foot{font-size:12px;color:var(--text-3);padding:12px 18px;border-top:1px solid var(--border);background:var(--surface-2)}

/* ---------- Anleitung Push (Startseite) ---------- */
.guide{margin-top:36px;text-align:left}
.guide-head{display:flex;gap:14px;align-items:flex-start}
.guide-head svg{flex:none;width:40px;height:40px;padding:10px;border-radius:11px;background:var(--accent-soft);color:var(--accent)}
.guide-head h2{font-size:17px;margin:0 0 4px}
.guide-head p{margin:0;font-size:14px;color:var(--text-2)}
.guide-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px}
.guide-grid > div + div{padding-top:16px;border-top:1px solid var(--border)}
.guide h3{font-size:14px;margin:0 0 6px}
.guide ol{margin:0;padding-left:20px;font-size:14px;color:var(--text-2);line-height:1.65}
.guide ol li{margin:6px 0}
.guide ul{margin:4px 0 0;padding-left:18px}
.guide a{color:var(--accent);font-weight:600}
.guide .code{margin-top:6px}
.guide .btn{height:32px;font-size:13px}

/* ---------- PDF-/Drucklayout ---------- */
.print-only{display:none}
@media print{
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f6f7f9; --border:#d9dde3; --border-strong:#c4cad3;
    --text:#101828; --text-2:#344054; --text-3:#667085; --accent:#1f4fd8; --accent-soft:#eef3ff;
    --pos:#067647; --pos-soft:#ecfdf3; --pos-line:#abefc6; --neu:#b54708; --neu-soft:#fffaeb; --neu-line:#fedf89;
    --neg:#b42318; --neg-soft:#fef3f2; --neg-line:#fecdca; --track:#eaecf0; --shadow:none;
    --sma50:#eb6834; --sma200:#6250d6; --inc-rev:#2f6bdb; --inc-ni:#1f9e9e; --inc-mar:#eb6834;
  }

    border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px}

  a{text-decoration:none;color:inherit}

}

/* ---------- States ---------- */
.welcome{max-width:640px;margin:56px auto 0;text-align:center}
.welcome h1{font-size:30px;letter-spacing:-.025em;margin:0 0 10px}
.welcome p{color:var(--text-2);margin:0 0 26px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick button{font:inherit;font-size:13.5px;padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:40px;text-align:left}
@media (max-width:640px){.feat{grid-template-columns:1fr}}
.feat div{padding:16px;font-size:13px;color:var(--text-2)}
.feat b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.loading{max-width:420px;margin:72px auto;text-align:center}
.spinner{width:34px;height:34px;border:3px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{list-style:none;padding:0;margin:18px 0 0;text-align:left;display:inline-block;font-size:13.5px;color:var(--text-3)}
.steps li{padding:3px 0;transition:color .3s}
.steps li.done{color:var(--text)} .steps li.done::before{content:"✓  ";color:var(--pos)}
.steps li:not(.done)::before{content:"○  "}
.error{max-width:520px;margin:64px auto;text-align:center;padding:28px}
.error b{display:block;font-size:17px;margin-bottom:6px}
@media (max-width:640px){
  .brand>div:last-child{display:none} .topbar .container{gap:10px} .pad{padding:18px}
  .search button{padding:0 12px} .v-meta{grid-template-columns:1fr}
  .v-label{font-size:32px} .co-name{font-size:22px} .price-box{text-align:left}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="container">
    <a class="brand" href="./" id="brand" title="Zur Startseite" aria-label="Aktien-Check – zur Startseite">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
      <div>Aktien-Check<small>Kaufen · Halten · Verkaufen</small></div>
    </a>
    <form class="search" id="f" autocomplete="off">
      <svg class="s" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Aktie oder Krypto, z. B. Allianz, SAP.DE, Bitcoin">
      <button type="submit">Prüfen</button>
      <div class="suggest" id="sg"></div>
    </form>
    <button class="icon-btn" id="wlbtn" title="Watchlist" aria-label="Watchlist öffnen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      <span class="badge-n" id="wlcount" style="display:none">0</span>
    </button>
    <button class="icon-btn acct-btn" id="acctbtn" title="Konto" aria-label="Konto" style="display:none">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span class="acct-name" id="acctname"></span>
    </button>
    <button class="icon-btn" id="theme" title="Hell/Dunkel umschalten" aria-label="Farbschema umschalten">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<nav class="subnav" id="subnav">
  <div class="container">
    <button class="home-btn" id="homebtn" type="button" title="Zurück zur Startseite" aria-label="Zurück zur Startseite">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Startseite</span></button>
    <a href="#ueberblick">Überblick</a><a href="#termine">Termine</a><a href="#verlauf">Verlauf</a><a href="#technik">Technik</a><a href="#fairerwert">Fairer Wert</a><a href="#kategorien">Einschätzung im Detail</a>
    <a href="#konkurrenz">Konkurrenz</a><a href="#analysten">Analysten</a><a href="#bilanz">Bilanz & Dividende</a><a href="#fundamental">Fundamentaldaten</a><a href="#news">News</a><a href="#ueber">Über</a><a href="#methodik">Methodik</a>
    <span class="sym" id="navsym"></span>
  </div>
</nav>
<main><div class="container" id="out"></div></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (x, d = 2) => x == null ? "–" : x.toLocaleString("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d});
const pc = (x, d = 1, sign = false) => x == null ? "–" : (sign && x > 0 ? "+" : "") + nf(x * 100, d) + " %";
const big = x => {
  if (x == null) return ["–", ""];
  const a = Math.abs(x);
  const [v, u] = a >= 1e12 ? [x / 1e12, "Bio."] : a >= 1e9 ? [x / 1e9, "Mrd."] : a >= 1e6 ? [x / 1e6, "Mio."] : [x, ""];
  return [nf(v, a >= 1e6 ? 1 : 2), u];
};
const tone = s => s == null ? "" : s >= 0.15 ? "pos" : s <= -0.15 ? "neg" : "neu";
const toneText = {pos: "positiv", neu: "neutral", neg: "negativ"};
const groupTone = {Kaufen: "pos", Halten: "neu", Verkaufen: "neg"};

/* Theme */
try { const t = localStorage.getItem("ac-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt;
  try { localStorage.setItem("ac-theme", nxt); } catch (e) {}
};

/* Search & suggestions */
let tmr, sugg = [], act = -1;
$("#q").addEventListener("input", e => {
  clearTimeout(tmr);
  const v = e.target.value.trim();
  if (v.length < 2) return hideSg();
  tmr = setTimeout(async () => {
    try {
      const r = await fetch("/api/search?q=" + encodeURIComponent(v));
      if (r.status === 401) return toLogin();
      sugg = await r.json(); act = -1; renderSg();
    } catch (e) {}
  }, 280);
});
$("#q").addEventListener("keydown", e => {
  if (!sugg.length || $("#sg").style.display !== "block") return;
  if (e.key === "ArrowDown") { act = Math.min(act + 1, sugg.length - 1); renderSg(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { act = Math.max(act - 1, 0); renderSg(); e.preventDefault(); }
  else if (e.key === "Enter" && act >= 0) { e.preventDefault(); pick(sugg[act].symbol); }
  else if (e.key === "Escape") hideSg();
});
function renderSg() {
  if (!sugg.length) return hideSg();
  $("#sg").innerHTML = sugg.map((s, i) => `<div class="${i === act ? "act" : ""}" data-s="${esc(s.symbol)}">
    <span>${esc(s.name)}${s.crypto ? ` <span class="tag" style="font-size:11px;padding:1px 6px">Krypto</span>` : s.etf ? ` <span class="tag" style="font-size:11px;padding:1px 6px">ETF</span>` : ""}</span><small>${esc(s.symbol)} · ${esc(s.exchange)}</small></div>`).join("");
  $("#sg").style.display = "block";
  $("#sg").querySelectorAll("div").forEach(d => d.onmousedown = () => pick(d.dataset.s));
}
function hideSg() { $("#sg").style.display = "none"; }
function toLogin(q) {
  const next = q ? "/?q=" + encodeURIComponent(q) : location.pathname + location.search;
  location.href = "/login?next=" + encodeURIComponent(next);
}
function pick(sym) { $("#q").value = sym; hideSg(); run(sym); }
document.addEventListener("click", e => { if (!e.target.closest(".search")) hideSg(); });
$("#f").onsubmit = e => { e.preventDefault(); hideSg(); const v = $("#q").value.trim(); if (v) run(v); };

/* Watchlist (pro Gerät im Browser gespeichert) */
let WL_KEY = "ac-watchlist";
let ME = null, wlPushTimer = null;
let wlSort = "score", wlView = false;
const wlBusy = new Set();
function wlLoad() { try { const l = JSON.parse(localStorage.getItem(WL_KEY)); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function wlSave(l, fromServer) {
  try { localStorage.setItem(WL_KEY, JSON.stringify(l)); } catch (e) {}
  wlBadge();
  if (!fromServer && ME) {  // Änderungen gebündelt an den Server schicken (gilt dann auf allen Geräten)
    clearTimeout(wlPushTimer);
    wlPushTimer = setTimeout(() => api("/api/watchlist", {items: wlLoad()}).catch(() => {}), 600);
  }
}
async function initAccount() {
  if (location.protocol === "file:") return;
  try { ME = await api("/api/me"); } catch (e) { return; }
  WL_KEY = "ac-watchlist:" + ME.user;
  if (ME.admin && document.querySelector(".welcome") && !document.querySelector("#admopen")) welcome();  // Admin-Kachel nachreichen
  if (ME.admin && location.search.includes("view=admin")) showAdmin();
  // Einmalige Übernahme der bisherigen Geräte-Watchlist in das Konto
  let legacy = [];
  try { legacy = JSON.parse(localStorage.getItem("ac-watchlist")) || []; } catch (e) {}
  try {
    const srv = (await api("/api/watchlist")).items || [];
    const have = new Set(srv.map(x => x.symbol));
    const merged = [...srv, ...legacy.filter(x => x.symbol && !have.has(x.symbol))];
    wlSave(merged, merged.length === srv.length);
    if (legacy.length) { try { localStorage.removeItem("ac-watchlist"); } catch (e) {} }
  } catch (e) {}
  if (ME.multi) {
    $("#acctbtn").style.display = "";
    $("#acctname").textContent = ME.user;
    $("#acctbtn").onclick = openAccount;
  }
  if (wlView) renderWl(); else if (!new URLSearchParams(location.search).get("q") && $(".welcome")) welcome();
}
function wlHas(sym) { return wlLoad().some(x => x.symbol === sym); }
function wlSnap(d) {
  return {symbol: d.symbol, name: d.name, exchange: d.exchange, currency: d.currency, price: d.price,
          label: d.rating.label, group: d.rating.group, score: d.rating.score, summary: d.summary.adjective,
          perf_1m: d.facts?.perf_1m ?? null, upside: d.facts?.upside ?? null, updated: new Date().toISOString(),
          next_event: (d.events || [])[0] || null};
}
function wlUpsert(d) {
  const l = wlLoad(), i = l.findIndex(x => x.symbol === d.symbol);
  if (i >= 0) { l[i] = {...l[i], ...wlSnap(d)}; wlSave(l); }
}
function wlToggle(d) {
  let l = wlLoad();
  const had = l.some(x => x.symbol === d.symbol);
  l = had ? l.filter(x => x.symbol !== d.symbol) : [...l, wlSnap(d)];
  wlSave(l);
  toast(had ? `${d.name} aus der Watchlist entfernt` : `${d.name} zur Watchlist hinzugefügt`);
  return !had;
}
function wlBadge() {
  const n = wlLoad().length, b = $("#wlcount");
  b.textContent = n; b.style.display = n ? "" : "none";
}
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
function ago(iso) {
  if (!iso) return "noch nicht analysiert";
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "gerade eben";
  if (min < 60) return `vor ${min} Min.`;
  if (min < 1440) return `vor ${Math.round(min / 60)} Std.`;
  return new Date(iso).toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "2-digit"});
}
function wlSorted() {
  const l = wlLoad();
  const by = {
    score: (a, b) => (b.score ?? -999) - (a.score ?? -999),
    name: (a, b) => (a.name || a.symbol).localeCompare(b.name || b.symbol, "de"),
    perf: (a, b) => (b.perf_1m ?? -9) - (a.perf_1m ?? -9),
    added: () => 0,
  }[wlSort];
  return wlSort === "added" ? l : [...l].sort(by);
}
function wlEvent(x) {
  const e = x.next_event;
  if (!e) return "";
  const days = Math.round((new Date(e.date + "T12:00:00") - new Date().setHours(12, 0, 0, 0)) / 86400000);
  if (days < 0 || days > 45) return "";
  return `<span class="wl-ev ${days <= 7 ? "soon" : ""}">📅 ${esc(e.label)} ${evWhen(days)}${e.estimated ? " (geschätzt)" : ""}</span>`;
}
function wlRow(x) {
  const t = groupTone[x.group] || "";
  const busy = wlBusy.has(x.symbol);
  return `<div class="wl-row" data-s="${esc(x.symbol)}">
    <div class="wl-name"><b>${esc(x.name || x.symbol)}</b><small>${esc(x.symbol)}${x.exchange ? " · " + esc(x.exchange) : ""}</small>${wlEvent(x)}</div>
    <div class="wl-price num m-hide">${x.price != null ? nf(x.price) + " " + esc(x.currency || "") : "–"}
      <small style="color:${x.perf_1m == null ? "var(--text-3)" : x.perf_1m >= 0 ? "var(--pos)" : "var(--neg)"}">${x.perf_1m != null ? pc(x.perf_1m, 1, true) + " 1M" : ""}</small></div>
    <div class="wl-rating">${busy ? `<span class="wl-busy"></span>` : x.label ? `<span class="tone ${t}">${esc(x.label)}</span>` : `<span class="stamp">–</span>`}</div>
    <div class="wl-score num m-hide">${x.score != null ? (x.score > 0 ? "+" : "") + nf(x.score, 1) : "–"}</div>
    <div class="m-hide">${esc(x.summary || "")}</div>
    <div class="wl-time m-hide">${busy ? "wird aktualisiert …" : ago(x.updated)}</div>
    <div class="wl-btns">${bellBtn(x.symbol)}
    <button class="x-btn" data-rm="${esc(x.symbol)}" title="Entfernen" aria-label="${esc(x.name || x.symbol)} entfernen">×</button></div>
  </div>`;
}
function wlBind(root) {
  root.querySelectorAll("[data-bell]").forEach(b => b.onclick = e => { e.stopPropagation(); openAlert(b.dataset.bell); });
  root.querySelectorAll(".wl-row[data-s]").forEach(r => r.onclick = e => {
    if (e.target.closest("[data-rm]") || e.target.closest("[data-bell]")) return;
    $("#q").value = r.dataset.s; run(r.dataset.s);
  });
  root.querySelectorAll("[data-rm]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const l = wlLoad(), x = l.find(i => i.symbol === b.dataset.rm);
    wlSave(l.filter(i => i.symbol !== b.dataset.rm));
    toast(`${x?.name || b.dataset.rm} entfernt`);
    wlView ? renderWl() : welcome();
  });
}
function showWatchlist() {
  runId++; wlView = true;
  $("#subnav").style.display = "none";
  navTo("?view=watchlist");
  renderWl(); window.scrollTo({top: 0});
  loadAlerts().then(() => renderWl());
}
function renderWl() {
  if (!wlView) return;
  const l = wlSorted();
  $("#out").innerHTML = `
    <div class="wl-head">
      <div><div class="eyebrow">${ME?.multi ? "Konto " + esc(ME.user) + " · auf allen Geräten" : "Gespeichert auf diesem Server"}</div><h1>Watchlist <span class="stamp" style="font-size:15px">${l.length} ${l.length === 1 ? "Aktie" : "Aktien"}</span></h1></div>
      ${l.length ? `<div class="wl-actions">
        <select id="wlsort" aria-label="Sortierung">
          ${[["score", "Nach Score"], ["name", "Nach Name"], ["perf", "Nach 1-Monats-Performance"], ["added", "Nach Hinzufügen"]]
            .map(([v, t]) => `<option value="${v}" ${v === wlSort ? "selected" : ""}>${t}</option>`).join("")}
        </select>
        <button class="btn" id="wlshare">Liste teilen</button>
        <button class="btn primary" id="wlupd" ${wlBusy.size ? "disabled" : ""}>${wlBusy.size ? `Aktualisiere … (${wlBusy.size})` : "Alle aktualisieren"}</button>
      </div>` : ""}
    </div>
    <div class="card" id="wllist">${l.length ? `
      <div class="wl-row head"><div>Aktie</div><div>Kurs</div><div>Empfehlung</div><div style="text-align:right">Score</div><div>Urteil</div><div>Stand</div><div></div></div>
      ${l.map(wlRow).join("")}` : `
      <div class="wl-empty"><b>Deine Watchlist ist noch leer</b>
        Analysiere eine Aktie und tippe auf <b style="display:inline">☆ Zur Watchlist</b>, um sie hier zu speichern.</div>`}
    </div>
    <div id="wlsharebox"></div>
    <div id="pushbox"></div>
    ${l.length ? `<p class="disclaimer">Die Watchlist gehört zu deinem Konto und ist auf allen deinen Geräten gleich. Mit „Liste teilen“ kannst du sie an andere weitergeben.
      Empfehlungen zeigen den Stand der letzten Analyse – „Alle aktualisieren“ analysiert jede Aktie neu (ca. 10–20 Sekunden pro Aktie).</p>` : ""}`;
  wlBind($("#out"));
  const sel = $("#wlsort"); if (sel) sel.onchange = () => { wlSort = sel.value; renderWl(); };
  const up = $("#wlupd"); if (up) up.onclick = () => wlUpdateAll();
  const sh = $("#wlshare"); if (sh) sh.onclick = () => wlShare();
  renderPush();
}
async function wlUpdate(sym) {
  wlBusy.add(sym); renderWl();
  try {
    const r = await fetch("/api/analyze?q=" + encodeURIComponent(sym));
    if (r.status === 401) return toLogin();
    if (r.ok) wlUpsert(await r.json());
  } catch (e) {} finally { wlBusy.delete(sym); renderWl(); }
}
async function wlUpdateAll(only) {
  const queue = (only || wlLoad().map(x => x.symbol)).filter(s => !wlBusy.has(s));
  const worker = async () => { while (queue.length) await wlUpdate(queue.shift()); };
  await Promise.all([worker(), worker()]);  // zwei Analysen gleichzeitig
  if (wlView) toast("Watchlist aktualisiert");
}
async function wlShare() {
  const link = location.origin + "/?import=" + encodeURIComponent(wlLoad().map(x => x.symbol).join(","));
  let copied = false;
  try { await navigator.clipboard.writeText(link); copied = true; } catch (e) {}
  if (navigator.share && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    try { await navigator.share({title: "Aktien-Check Watchlist", url: link}); return; } catch (e) {}
  }
  $("#wlsharebox").innerHTML = `<div class="card pad" style="margin-top:16px">
    <b>Link zum Übertragen</b><div class="stamp">Öffne diesen Link auf dem anderen Gerät – die Aktien werden dort zur Watchlist hinzugefügt.</div>
    <div class="share-box"><input id="sharelink" readonly value="${esc(link)}"><button class="btn" id="copylink">Kopieren</button></div></div>`;
  $("#sharelink").onclick = e => e.target.select();
  $("#copylink").onclick = async () => {
    try { await navigator.clipboard.writeText(link); toast("Link kopiert"); }
    catch (e) { $("#sharelink").select(); document.execCommand("copy"); toast("Link kopiert"); }
  };
  if (copied) toast("Link kopiert");
}
function wlImport(list) {
  const syms = list.split(",").map(x => x.trim().toUpperCase()).filter(x => /^[A-Z0-9.\-^=]{1,15}$/.test(x));
  const l = wlLoad(), have = new Set(l.map(x => x.symbol));
  const added = syms.filter(x => !have.has(x));
  wlSave([...l, ...added.map(symbol => ({symbol, name: symbol}))]);
  showWatchlist();
  toast(added.length ? `${added.length} ${added.length === 1 ? "Aktie" : "Aktien"} importiert – werden analysiert` : "Alle Aktien sind bereits in der Watchlist");
  if (added.length) wlUpdateAll(added);
}
/* Preisalarme (auf dem Server gespeichert, Versand per ntfy-Push) */
let ALERTS = null;
const BELL_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (r.status === 401) { toLogin(); throw new Error("login"); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Fehler");
  return d;
}
async function loadAlerts() {
  try { ALERTS = await api("/api/alerts"); } catch (e) { ALERTS = ALERTS || null; }
  return ALERTS;
}
function alertFired(a) { const st = a?.state || {}; return !!(st.below_fired || st.above_fired); }
function alertSummary(a, cur) {
  if (!a) return "";
  const c = cur || a.currency || "";
  const parts = [];
  if (a.below) parts.push(`unter ${nf(a.below)} ${c}`);
  if (a.above) parts.push(`über ${nf(a.above)} ${c}`);
  if (a.move) parts.push(`±${nf(a.move, 1)} % am Tag`);
  if (a.rating) parts.push("Empfehlungswechsel");
  if (a.events) parts.push("Termin-Erinnerung");
  return parts.join(" · ");
}
function bellBtn(sym) {
  const a = ALERTS?.alerts?.[sym];
  const cls = !a ? "" : alertFired(a) ? "fired" : "on";
  return `<button class="bell-btn ${cls}" data-bell="${esc(sym)}" title="${a ? "Alarm: " + esc(alertSummary(a)) : "Preisalarm einrichten"}" aria-label="Preisalarm">${BELL_SVG}</button>`;
}
function closeModal() { document.querySelector(".modal-bg")?.remove(); }
async function openAlert(sym, d) {
  if (!ALERTS) await loadAlerts();
  const w = wlLoad().find(x => x.symbol === sym) || {};
  const info = d ? {name: d.name, currency: d.currency, price: d.price, label: d.rating.label}
                 : {name: w.name || sym, currency: w.currency || "", price: w.price, label: w.label};
  const a = ALERTS?.alerts?.[sym] || {};
  const st = a.state || {};

const GL_INDEX = (() => {
  const pairs = [];
  GLOSSARY.forEach((g, i) => g[3].forEach(a => pairs.push([a, i])));
  pairs.sort((a, b) => b[0].length - a[0].length);   // längere Begriffe zuerst (Forward-KGV vor KGV)
  const esc_ = t => t.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&");
  return {re: new RegExp(`(?<![\\wÄÖÜäöüß-])(${pairs.map(p => esc_(p[0])).join("|")})(?![\\wÄÖÜäöüß])`, "g"),
          map: new Map(pairs.map(p => [p[0], p[1]]))};
})();
function glossarize(root) {
  if (!root) return;
  const scopes = root.querySelectorAll(".reasons li, .fund .fk, .facts dt, .v-meta dt, .about-row dt, .trk-g dt, .method li, .ov-cat, .fv-ass li, .fc-row span:first-child, .fv-head .stamp, .tt-r span:first-child, .pat-n");
  scopes.forEach(el => {
    const seen = new Set();
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      if (node.parentElement.closest(".gl, a, button")) return;
      const txt = node.nodeValue;
      GL_INDEX.re.lastIndex = 0;
      if (!GL_INDEX.re.test(txt)) return;
      GL_INDEX.re.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let last = 0, mt;
      while ((mt = GL_INDEX.re.exec(txt))) {
        const i = GL_INDEX.map.get(mt[1]);
        if (seen.has(i)) continue;
        seen.add(i);
        frag.append(txt.slice(last, mt.index));
        const sp = document.createElement("span");
        sp.className = "gl"; sp.dataset.g = i; sp.tabIndex = 0; sp.setAttribute("role", "button");
        sp.textContent = mt[1];
        frag.append(sp);
        last = mt.index + mt[1].length;
      }
      if (!last) return;
      frag.append(txt.slice(last));
      node.replaceWith(frag);
    });
  });
}
function glPopup(el) {
  closeGl();
  const g = GLOSSARY[+el.dataset.g];
  const pop = document.createElement("div");
  pop.className = "gl-pop"; pop.setAttribute("role", "dialog");
  pop.innerHTML = `<b>${esc(g[1])}</b><p>${esc(g[2])}</p><a href="?view=glossar" class="gl-all">Alle Begriffe im Glossar</a>`;
  document.body.append(pop);
  const r = el.getBoundingClientRect(), w = Math.min(320, window.innerWidth - 24);
  pop.style.width = w + "px";
  pop.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + r.width / 2 - w / 2)) + window.scrollX + "px";
  const below = r.bottom + 8 + pop.offsetHeight < window.innerHeight;
  pop.style.top = (below ? r.bottom + 8 : r.top - pop.offsetHeight - 8) + window.scrollY + "px";
  pop.querySelector(".gl-all").onclick = e => { e.preventDefault(); closeGl(); showGlossary(); };
}
function closeGl() { document.querySelectorAll(".gl-pop").forEach(p => p.remove()); }
document.addEventListener("click", e => {
  const g = e.target.closest(".gl");
  if (g) { e.preventDefault(); glPopup(g); return; }
  if (!e.target.closest(".gl-pop")) closeGl();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeGl();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("gl")) { e.preventDefault(); glPopup(e.target); }
});
window.addEventListener("scroll", closeGl, {passive: true});
function showGlossary() {

/* Fairer Wert: Spanne aus drei Szenarien mit Kursmarke + Analystenprognosen */
function fairCard(d) {
  const f = d.fair, fc = d.forecast || {};
  if (!f && !(fc.rev && (fc.rev["0y"] || fc.rev["+1y"]))) return "";
  const cur = esc(d.currency), price = d.price;
  const growthRow = (lab, e) => {
    const cells = ["0y", "+1y"].map(p => e?.[p]?.growth != null ? `<span class="num" style="color:${e[p].growth >= 0 ? "var(--pos)" : "var(--neg)"}">${pc(e[p].growth, 1, true)}</span>` : "<span class='stamp'>–</span>");
    return `<div class="fc-row"><span>${lab}</span>${cells.join("")}</div>`;
  };
  let range = "";
  if (f && f.base) {
    const vals = [f.bear, f.base, f.bull, price].filter(v => v != null && v > 0);
    const lo = Math.min(...vals) * 0.9, hi = Math.max(...vals) * 1.08;
    const X = v => ((v - lo) / (hi - lo) * 100).toFixed(2);
    const up = f.upside;
    const verdict = up >= 0.15 ? ["unter dem fairen Wert", "var(--pos)"] : up <= -0.15 ? ["über dem fairen Wert", "var(--neg)"] : ["nahe am fairen Wert", "var(--neu)"];
    const aboveBull = f.bull && price > f.bull, belowBear = f.bear && price < f.bear;
    range = `
      <div class="fv-head">
        <div><div class="eyebrow">Fairer Wert je Aktie</div>
          <div class="fv-val num">${nf(f.base)} <small>${cur}</small></div>
          <div class="stamp">Basisszenario · ${esc(f.method)}</div></div>
        <div class="fv-up"><span class="num" style="color:${verdict[1]}">${pc(up, 1, true)}</span><small>Kurs liegt ${verdict[0]}</small></div>
      </div>
      <div class="fv-bar" role="img" aria-label="Fairer Wert vorsichtig ${nf(f.bear)}, Basis ${nf(f.base)}, optimistisch ${nf(f.bull)}, Kurs ${nf(price)} ${cur}">
        ${f.bear && f.bull ? `<span class="fv-span" style="left:${X(f.bear)}%;width:${X(f.bull) - X(f.bear)}%"></span>` : ""}
        ${[["bear", "vorsichtig"], ["base", "Basis"], ["bull", "optimistisch"]].filter(([k]) => f[k]).map(([k, l]) =>
          `<span class="fv-tick ${k}" style="left:${X(f[k])}%"><b class="num">${nf(f[k], f[k] < 10 ? 2 : 0)}</b><small>${l}</small></span>`).join("")}
        <span class="fv-price" style="left:${X(price)}%"><b class="num">${nf(price, price < 10 ? 2 : 0)}</b><small>Kurs</small></span>
      </div>
      ${aboveBull ? `<div class="note" style="margin-top:12px">Der Kurs liegt sogar über dem optimistischen Szenario – der Markt erwartet mehr Wachstum oder einen niedrigeren Zins, als das Modell annimmt.</div>`
        : belowBear ? `<div class="note" style="margin-top:12px;border-color:var(--pos-line);background:var(--pos-soft);color:var(--text)">Der Kurs liegt unter dem vorsichtigen Szenario – auffällig günstig, sofern die Annahmen halten.</div>` : ""}
      <details class="fv-ass"><summary>Annahmen der Szenarien</summary><ul>${(f.assumptions || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul>
        <p class="stamp">Ein Cashflow-Modell reagiert stark auf Wachstum und Zins: 1 Prozentpunkt mehr Diskontsatz senkt den Wert oft um 15–25 %. Deshalb zählt der faire Wert nur moderat in die Bewertung.</p></details>`;
  } else if (f && f.na) {
    range = `<div class="eyebrow">Fairer Wert je Aktie</div><p class="stamp" style="margin:6px 0 0">${esc(f.na)}</p>`;
  }
  const hasFc = fc.rev && (fc.rev["0y"] || fc.rev["+1y"]);
  return `<section class="card fv-card" id="fairerwert" aria-label="Fairer Wert und Prognosen">
    <div class="fv-grid">
      <div>${range || `<div class="eyebrow">Fairer Wert je Aktie</div><p class="stamp" style="margin:6px 0 0">Für diesen Wert ist kein fairer Wert berechenbar.</p>`}</div>
      ${hasFc ? `<div class="fc">
        <div class="eyebrow">Prognosen der Analysten${fc.n ? ` · ${fc.n} Analysten` : ""}</div>
        <div class="fc-row head"><span></span><span>dieses GJ</span><span>nächstes GJ</span></div>
        ${growthRow("Umsatz", fc.rev)}${growthRow("Gewinn je Aktie", fc.eps)}
        ${fc.fpe ? `<div class="fc-row"><span>Forward-KGV</span><span class="num" style="grid-column:span 2">${nf(fc.fpe, 1)}</span></div>` : ""}
        <p class="stamp" style="margin:8px 0 0">Wachstum gegenüber dem Vorjahr. Analystenprognosen sind im Schnitt zu optimistisch – die App nutzt sie gemischt mit der eigenen Historie.</p>
      </div>` : ""}
    </div>
  </section>`;
}

/* Screener: Rangliste aller bewerteten Indexwerte */
const SCR = {data: null, uni: "all", filters: new Set(), sort: "score", q: "", panel: false, pick: null, mode: "due"};
try { Object.assign(SCR, JSON.parse(localStorage.getItem("ac-scr") || "{}"), {data: null}); SCR.filters = new Set(SCR.filters || []); } catch (e) { SCR.filters = new Set(); }
const SCR_FILTERS = [
  ["buy", "Nur Kaufen", r => r.group === "Kaufen"],
  ["fair", "Unter fairem Wert", r => r.fair_up != null && r.fair_up >= 0.1],
  ["div", "Dividende ab 3 %", r => (r.div || 0) >= 0.03],
  ["qv", "Qualität stark & günstig", r => (r.c.quality ?? -1) >= 0.3 && (r.c.valuation ?? -1) >= 0.1],
  ["trend", "Starker Trend", r => (r.c.chart ?? -1) >= 0.4],
  ["sell", "Verkaufskandidaten", r => r.group === "Verkaufen"],
];
const SCR_SORT = {score: ["Score", (a, b) => b.score - a.score], fair: ["Potenzial zum fairen Wert", (a, b) => (b.fair_up ?? -9) - (a.fair_up ?? -9)],
  div: ["Dividendenrendite", (a, b) => (b.div || 0) - (a.div || 0)], perf: ["Performance 1 Jahr", (a, b) => (b.perf_1y ?? -9) - (a.perf_1y ?? -9)],
  pe: ["KGV (niedrig zuerst)", (a, b) => (a.pe > 0 ? a.pe : 999) - (b.pe > 0 ? b.pe : 999)], name: ["Name", (a, b) => a.name.localeCompare(b.name, "de")]};
function scrSave() { try { localStorage.setItem("ac-scr", JSON.stringify({uni: SCR.uni, filters: [...SCR.filters], sort: SCR.sort, pick: SCR.pick})); } catch (e) {} }
let scrTimer = null;
function scrPoll() {
  clearTimeout(scrTimer);
  if (!SCR.data?.running || !location.search.includes("view=screener")) return;
  scrTimer = setTimeout(async () => {
    try { SCR.data = await api("/api/screener"); } catch (e) { return; }
    if (location.search.includes("view=screener")) { renderScreener(); scrPoll(); }
  }, 10000);
}
async function scrAction(path, body) {
  try {
    const d = await api(path, body || {});
    SCR.data = d;
    if (d.message) toast(d.message);
    renderScreener(); scrPoll();
  } catch (e) { if (e.message !== "login") toast("Fehlgeschlagen: " + e.message); }
}
async function showScreener() {
  runId++; wlView = false;
  $("#subnav").style.display = "none";
  navTo("?view=screener");
  window.scrollTo({top: 0});

  try { SCR.data = await api("/api/screener"); } catch (e) {
    if (e.message !== "login") $("#out").innerHTML = `<div class="card pad">Screener nicht verfügbar: ${esc(e.message)}</div>`; return; }
  renderScreener(); scrPoll();
}

  let rows = D.rows.filter(r => SCR.uni === "all" || r.u.includes(SCR.uni));

  rows.sort(SCR_SORT[SCR.sort][1]);
  const U = D.universes, totalDone = Object.values(U).reduce((a, u) => a + u.done, 0);

    </div>

      const n = SCR.mode === "all" ? pick.reduce((a, k) => a + U[k].total, 0) : pick.reduce((a, k) => a + (D.due_by?.[k] || 0), 0);
      return `<div class="scr-panel card" id="scrpanel">
        <b>Welchen Index soll der Screener bewerten?</b>
        <div class="scr-picks">${Object.entries(U).map(([k, u]) => `<label class="scr-pick">

        <div class="scr-modes">
          <label><input type="radio" name="scrmode" value="due" ${SCR.mode !== "all" ? "checked" : ""}> Nur veraltete Werte (älter als 20 Stunden)</label>

        </div>
        <div class="scr-err" id="screrr" role="alert"></div>
        <div class="scr-go">
          <span class="stamp">${pick.length ? `${n} ${n === 1 ? "Wert" : "Werte"} · etwa ${Math.max(1, Math.round(n * (D.pause + 25) / 60))} Min.${n === 0 ? " – nichts zu tun, ggf. „Alle Werte neu bewerten“ wählen" : ""}` : ""}
</span>
          <span><button class="btn" id="scrcancel">Abbrechen</button> <button class="btn primary" id="scrgo">Starten</button></span>

/* Technische Analyse: Gesamtsignal je Zeitrahmen, Einzelindikatoren, Chartmuster */

}
function initTechCard(d) {

  if (!frames.includes(TC.frame)) TC.frame = frames[0];
  const gauge = s_ => { const pos = ((s_.score + 1) / 2 * 100).toFixed(1);
    return `<div class="tg"><div class="tg-track"><span style="left:${pos}%"></span></div><div class="tg-lab"><span>Verkaufen</span><span>Neutral</span><span>Kaufen</span></div></div>`; };

      <div class="tc-overview">${frames.map(f => `<div class="tc-o ${f === TC.frame ? "on" : ""}"><small>${f === "Tag" ? "Tag" : f === "Woche" ? "Woche" : "Monat"}</small><b style="color:${SIG_COL[T.frames[f].sum.label]}">${T.frames[f].sum.label}</b></div>`).join("")}</div>
      ${gauge(F.sum)}
      <div class="tt-grid">${table("Oszillatoren", F.osc, F.osc_sum)}${table("Gleitende Durchschnitte", F.ma, F.ma_sum)}</div>
      ${(T.patterns || []).length ? `<div class="pat"><b>Chartmuster (Hinweise)</b>${T.patterns.map(p_ => `<div class="pat-r ${p_.kind}">
          <span class="pat-n">${esc(p_.name)} <small class="pat-s ${p_.status === "bestätigt" ? "ok" : ""}">${esc(p_.status)}</small></span>
          <span class="stamp">${esc(p_.text)} · ${esc(p_.from)} – ${esc(p_.to)}</span></div>`).join("")}</div>`
        : `<div class="pat stamp">Derzeit kein klassisches Chartmuster erkannt.</div>`}
      <p class="stamp" style="margin:10px 0 0">Signale nach festen Regeln (z. B. RSI unter 30 = Kaufen, Kurs über Durchschnitt = Kaufen). Chartmuster werden automatisch erkannt und sind nur Hinweise –

    box.querySelectorAll("#tc-seg button").forEach(b => b.onclick = () => { TC.frame = b.dataset.f; render_(); glossarize(box); });

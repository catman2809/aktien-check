  return `<section class="card ck-card" id="checkliste" aria-label="Stärken und Warnsignale">
    <div class="ck-grid">
      <div><div class="eyebrow" style="color:var(--pos)">Stärken · ${plus.length}</div><ul>${plus.map(x => li(x, true)).join("") || "<li class='stamp'>Keine besonderen Stärken gefunden</li>"}</ul></div>
      <div><div class="eyebrow" style="color:var(--neg)">Warnsignale · ${risk.length}</div><ul>${risk.map(x => li(x, false)).join("") || "<li class='stamp'>Keine Warnsignale gefunden</li>"}</ul></div>
    </div></section>`;
}

/* Bewertungschart (Kurs vs. fairer Wert aus Gewinn × Normal-KGV) und KGV-Verlauf */
const VC = {mode: "fair", d: null};
function valChartCard(d) {
  const v = d.valchart;
  if (!v || !(v.prices || []).length || !(v.eps || []).some(e => e[1] > 0)) return "";
  return `<section class="card chart-card" id="bewertungschart" aria-label="Bewertung im Zeitverlauf">
    <div class="chart-head">
      <div><div class="eyebrow">Bewertung im Zeitverlauf</div><div class="chart-chg" id="vc-sub"></div></div>
      <div class="seg" id="vc-seg"><button data-m="fair">Kurs vs. fairer Wert</button><button data-m="pe">KGV-Verlauf</button></div>
    </div>
    <div class="chart-wrap" id="vc-wrap" style="height:240px"></div>
    <div class="chart-foot" id="vc-foot"></div>
  </section>`;
}
function initValChart(d) {
  if (!$("#vc-wrap")) return;
  VC.d = d;
  document.querySelectorAll("#vc-seg button").forEach(b => b.onclick = () => { VC.mode = b.dataset.m; drawValChart(); });
  let last = 0;
  new ResizeObserver(() => { const w = $("#vc-wrap")?.clientWidth; if (w && w !== last) { last = w; drawValChart(); } }).observe($("#vc-wrap"));
}
function drawValChart() {
  const d = VC.d, v = d?.valchart, wrap = $("#vc-wrap"); if (!v || !wrap) return;
  document.querySelectorAll("#vc-seg button").forEach(b => b.classList.toggle("on", b.dataset.m === VC.mode));
  const W = wrap.clientWidth, H = wrap.clientHeight, m = {l: 4, r: 66, t: 12, b: 26}, pw = W - m.l - m.r, ph = H - m.t - m.b;
  const toTs = s_ => new Date(s_ + "T00:00:00").getTime();
  const P = v.prices, t0 = P[0][0];
  const epsAll = [...v.eps.map(e => [toTs(e[0]), e[1], false]), ...(v.est || []).map(e => [toTs(e[0]), e[1], true])];
  const t1 = Math.max(P[P.length - 1][0], ...epsAll.map(e => e[0]));
  const X = t => m.l + (t - t0) / (t1 - t0) * pw;
  const yrs = [...new Set(P.map(p => new Date(p[0]).getFullYear()))];
  const axisX = yrs.filter((y, i) => i % Math.ceil(yrs.length / (W < 420 ? 4 : 7)) === 0)
    .map(y => `<text x="${X(new Date(y, 0, 1).getTime()).toFixed(1)}" y="${H - 6}" text-anchor="middle">${y}</text>`).join("");
  if (VC.mode === "pe") {
    const S = v.pe || []; if (S.length < 2) { wrap.innerHTML = `<div class="chart-msg">Kein KGV-Verlauf verfügbar (Verluste oder zu wenig Daten).</div>`; return; }
    const vals = [...S.map(x => x[1]), v.pe_avg, v.pe_norm].filter(x => x != null);
    let lo = Math.min(...vals) * 0.9, hi = Math.max(...vals) * 1.08; const {ticks} = niceTicks(lo, hi, 4);
    const Y = y => m.t + (1 - (y - lo) / (hi - lo)) * ph;
    wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="KGV-Verlauf">
      <g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>
      <g class="axis">${ticks.map(t => `<text x="${W - 4}" y="${Y(t) + 4}" text-anchor="end">${nf(t, 0)}</text>`).join("")}${axisX}</g>
      ${v.pe_avg ? `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(v.pe_avg)}" y2="${Y(v.pe_avg)}" stroke="var(--text-3)" stroke-dasharray="5 4"/>` : ""}
      <path d="${S.map((x, i) => `${i ? "L" : "M"}${X(x[0]).toFixed(1)},${Y(x[1]).toFixed(1)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    </svg>`;
    const cur = S[S.length - 1][1];
    $("#vc-sub").innerHTML = `<span style="color:var(--text-2);margin:0">KGV aktuell <b class="num">${nf(cur, 1)}</b> · Ø ${nf(v.pe_avg, 1)}</span>
      <span>${cur > v.pe_avg * 1.15 ? "über dem eigenen Durchschnitt" : cur < v.pe_avg * 0.85 ? "unter dem eigenen Durchschnitt" : "nahe am Durchschnitt"}</span>`;
    $("#vc-foot").innerHTML = `<div class="legend"><span style="color:var(--accent)"><i></i><span style="color:var(--text-2)">KGV (Kurs / Gewinn des letzten Geschäftsjahres)</span></span>
      <span style="color:var(--text-3)"><i style="border-top-style:dashed"></i><span style="color:var(--text-2)">Durchschnitt</span></span></div>`;
    return;
  }
  // Faire Linie: Gewinn je Geschäftsjahr × Normal-KGV, gilt ab Ende des Vorjahres bis Ende des Geschäftsjahres
  const segs = epsAll.map((e, i) => ({from: i ? epsAll[i - 1][0] : e[0] - 365 * 864e5, to: e[0], val: e[1] * v.pe_norm, est: e[2]}))
    .filter(s_ => s_.val > 0 && s_.to >= t0);
  const vals = [...P.map(p => p[1]), ...segs.map(s_ => s_.val)];
  let lo = Math.min(...vals) * 0.85, hi = Math.max(...vals) * 1.08; lo = Math.max(0, lo);
  const {ticks} = niceTicks(lo, hi, 4), Y = y => m.t + (1 - (y - lo) / (hi - lo)) * ph;
  const segPath = s_ => `M${X(Math.max(s_.from, t0)).toFixed(1)},${Y(s_.val).toFixed(1)}L${X(s_.to).toFixed(1)},${Y(s_.val).toFixed(1)}`;
  const area = segs.filter(s_ => !s_.est).map(s_ => `<rect x="${X(Math.max(s_.from, t0)).toFixed(1)}" y="${Y(s_.val).toFixed(1)}" width="${(X(s_.to) - X(Math.max(s_.from, t0))).toFixed(1)}" height="${(m.t + ph - Y(s_.val)).toFixed(1)}" fill="var(--sma50)" opacity=".10"/>`).join("");
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kurs im Vergleich zum fairen Wert aus Gewinn mal Normal-KGV">
    <g class="grid">${ticks.map(t => `<line x1="${m.l}" x2="${m.l + pw}" y1="${Y(t)}" y2="${Y(t)}"/>`).join("")}</g>
    <g class="axis">${ticks.map(t => `<text x="${W - 4}" y="${Y(t) + 4}" text-anchor="end">${nf(t, t < 10 ? 1 : 0)}</text>`).join("")}${axisX}</g>
    ${area}
    ${segs.map(s_ => `<path d="${segPath(s_)}" fill="none" stroke="var(--sma50)" stroke-width="2.2" ${s_.est ? 'stroke-dasharray="5 4"' : ""}/>`).join("")}
    <path d="${P.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("")}" fill="none" stroke="var(--text)" stroke-width="1.8"/>
  </svg>`;
  const lastP = P[P.length - 1][1], curSeg = segs.find(s_ => s_.from <= P[P.length - 1][0] && s_.to >= P[P.length - 1][0]) || segs[segs.length - 1];
  const gap = curSeg ? lastP / curSeg.val - 1 : null;
  $("#vc-sub").innerHTML = gap == null ? "" : `<span style="color:${gap > 0.1 ? "var(--neg)" : gap < -0.1 ? "var(--pos)" : "var(--text-2)"};margin:0">Kurs ${pc(gap, 0, true)} ${gap >= 0 ? "über" : "unter"} der fairen Linie</span>
    <span>bei einem Normal-KGV von ${nf(v.pe_norm, 1)}</span>`;
  $("#vc-foot").innerHTML = `<div class="legend"><span style="color:var(--text)"><i></i><span style="color:var(--text-2)">Kurs (Monatsende)</span></span>
    <span style="color:var(--sma50)"><i></i><span style="color:var(--text-2)">Gewinn je Aktie × ${nf(v.pe_norm, 1)} (Normal-KGV)</span></span>
    ${(v.est || []).length ? `<span style="color:var(--sma50)"><i style="border-top-style:dashed"></i><span style="color:var(--text-2)">Prognose der Analysten</span></span>` : ""}</div>
    <span>Liegt der Kurs über der orangen Linie, ist die Aktie teurer als üblich – darunter günstiger.</span>`;
}

/* Analysten: Kursziel-Spanne, Urteile im Zeitverlauf, Gewinnüberraschungen */
function analystSection(d) {
  if (d.asset === "crypto" || d.asset === "etf") return "";
  const T = d.targets || {}, Q = (d.eps_quarters || []).filter(q => q.est != null && q.act != null), price = d.price;
  const hasRange = T.low && T.high && price, hasHist = (T.hist || []).length, hasQ = Q.length >= 2;
  if (!hasRange && !hasHist && !hasQ) return "";
  let range = "";
  if (hasRange) {
    const lo = Math.min(T.low, price) * 0.97, hi = Math.max(T.high, price) * 1.03, X = v => ((v - lo) / (hi - lo) * 100).toFixed(2);
    range = `<div class="card pad"><h3>Kursziele der Analysten${T.n ? ` <span class="stamp">${T.n} Analysten</span>` : ""}</h3>
      <div class="tg-bar"><span class="tg-span" style="left:${X(T.low)}%;width:${X(T.high) - X(T.low)}%"></span>
        ${[["low", "Tief"], ["mean", "Ø"], ["high", "Hoch"]].filter(([k]) => T[k]).map(([k, l]) => `<span class="tg-tick ${k}" style="left:${X(T[k])}%"><b class="num">${nf(T[k], T[k] < 10 ? 2 : 0)}</b><small>${l}</small></span>`).join("")}
        <span class="fv-price" style="left:${X(price)}%"><b class="num">${nf(price, price < 10 ? 2 : 0)}</b><small>Kurs</small></span></div>
      <div class="stamp">Potenzial bis zum Ø-Kursziel: <b style="color:${T.mean >= price ? "var(--pos)" : "var(--neg)"}">${pc(T.mean / price - 1, 1, true)}</b>
        · Spanne ${pc(T.low / price - 1, 0, true)} bis ${pc(T.high / price - 1, 0, true)}</div></div>`;
  }
  let hist = "";
  if (hasHist) {
    const lab = {"0m": "aktuell", "-1m": "vor 1 Mon.", "-2m": "vor 2 Mon.", "-3m": "vor 3 Mon."};
    const keys = [["strongBuy", "Strong Buy", "var(--pos)", 1], ["buy", "Buy", "var(--pos)", .55], ["hold", "Hold", "var(--neu)", .7], ["sell", "Sell", "var(--neg)", .55], ["strongSell", "Strong Sell", "var(--neg)", 1]];
    hist = `<div class="card pad"><h3>Analystenurteile im Zeitverlauf</h3>
      ${T.hist.slice().reverse().map(r => { const tot = keys.reduce((a, [k]) => a + (r[k] || 0), 0) || 1;
        return `<div class="rh-row"><span class="stamp">${esc(lab[r.period] || r.period)}</span><span class="rh-bar">${keys.map(([k, l, c, o]) => r[k] ? `<i style="width:${r[k] / tot * 100}%;background:${c};opacity:${o}" title="${l}: ${r[k]}"></i>` : "").join("")}</span><span class="num stamp">${tot}</span></div>`; }).join("")}
      <div class="legend" style="margin-top:8px">${keys.map(([k, l, c, o]) => `<span><i style="border:0;width:10px;height:10px;border-radius:3px;background:${c};opacity:${o}"></i>${l}</span>`).join("")}</div></div>`;
  }
  let qs = "";
  if (hasQ) {
    const vals = Q.flatMap(q => [q.est, q.act]);
    let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.25 || Math.abs(hi) * 0.2 || 0.1; lo -= pad; hi += pad;
    const top = v => ((1 - (v - lo) / (hi - lo)) * 100).toFixed(1);
    const qLabel = s_ => { const dt = new Date(s_ + "T00:00:00"); return isNaN(dt) ? s_ : `Q${Math.floor(dt.getMonth() / 3) + 1} ${String(dt.getFullYear()).slice(2)}`; };
    qs = `<div class="card pad"><h3>Gewinnüberraschungen <span class="stamp">Gewinn je Aktie</span></h3>
      <div class="eq" role="img" aria-label="Erwarteter und tatsächlicher Gewinn je Aktie der letzten ${Q.length} Quartale">
        ${Q.map(q => { const beat = q.act >= q.est, a_ = +top(q.act), e_ = +top(q.est);
          return `<div class="eq-c" title="${qLabel(q.q)}: erwartet ${nf(q.est, 2)}, tatsächlich ${nf(q.act, 2)}">
            <div class="eq-plot"><span class="eq-line ${beat ? "pos" : "neg"}" style="top:${Math.min(a_, e_)}%;height:${Math.abs(a_ - e_)}%"></span>
              <span class="eq-dot est" style="top:${e_}%"></span><span class="eq-dot act ${beat ? "pos" : "neg"}" style="top:${a_}%"></span></div>
            <b class="num" style="color:${beat ? "var(--pos)" : "var(--neg)"}">${q.est ? pc(q.act / q.est - 1, 0, true) : ""}</b>
            <small>${qLabel(q.q)}</small></div>`; }).join("")}
      </div>
      <div class="legend"><span><i style="border:2px solid var(--text-3);width:10px;height:10px;border-radius:50%"></i>erwartet</span>
        <span><i style="border:0;width:10px;height:10px;border-radius:50%;background:var(--pos)"></i>übertroffen</span>
        <span><i style="border:0;width:10px;height:10px;border-radius:50%;background:var(--neg)"></i>verfehlt</span></div></div>`;
  }
  return `<h2 class="section" id="analysten">Analysten & Erwartungen</h2>
    <p class="section-sub">Kursziele, wie sich die Urteile verändert haben und ob das Unternehmen die Erwartungen zuletzt erfüllt hat.</p>
    <div class="an-grid">${range}${hist}${qs}</div>`;
}

/* Finanzielle Gesundheit, Dividendenhistorie, Aktionärsstruktur */
function healthSection(d) {
  if (d.asset === "crypto" || d.asset === "etf") return "";
  const B = d.balance, Dv = d.divhist, Ho = d.holders, cur = esc(d.currency);
  const last = arr => { for (let i = (arr || []).length - 1; i >= 0; i--) if (arr[i] != null) return arr[i]; return null; };
  let bal = "";
  if (B) {
    const pairs = [["Cash", last(B.cash), "Schulden", last(B.debt)], ["Umlaufvermögen", last(B.ca), "kurzfr. Verbindlichkeiten", last(B.cl)],
                   ["Eigenkapital", last(B.equity), "Verbindlichkeiten", last(B.liab)]].filter(p => p[1] != null && p[3] != null);
    const yrs = B.years || [], mx = Math.max(...[...(B.debt || []), ...(B.cash || [])].filter(x => x != null), 1);
    bal = `<div class="card pad"><h3>Finanzielle Gesundheit <span class="stamp">${esc(yrs[yrs.length - 1] || "")}</span></h3>
      ${pairs.map(([a, av, b, bv]) => { const mm = Math.max(av, bv, 1); return `<div class="hb">
        <div class="hb-l"><span>${a}</span><b class="num">${big(av).join(" ")}</b></div>
        <div class="hb-bars"><i class="pos" style="width:${av / mm * 100}%"></i><i class="neg" style="width:${bv / mm * 100}%"></i></div>
        <div class="hb-l"><span>${b}</span><b class="num">${big(bv).join(" ")}</b></div></div>`; }).join("")}
      ${yrs.length >= 3 ? `<div class="stamp" style="margin:12px 0 4px">Schulden und Cash im Zeitverlauf (${cur})</div>
        <div class="yb">${yrs.map((y, i) => `<div class="yb-c" title="${y}: Schulden ${big(B.debt?.[i]).join(" ")}, Cash ${big(B.cash?.[i]).join(" ")}">
          <div class="yb-bars"><i class="neg" style="height:${(B.debt?.[i] || 0) / mx * 100}%"></i><i class="pos" style="height:${(B.cash?.[i] || 0) / mx * 100}%"></i></div><small>${y}</small></div>`).join("")}</div>
        <div class="legend"><span><i style="border:0;width:10px;height:10px;border-radius:3px;background:var(--pos);opacity:.7"></i>Cash</span><span><i style="border:0;width:10px;height:10px;border-radius:3px;background:var(--neg);opacity:.7"></i>Schulden</span></div>` : ""}</div>`;
  }
  let div = "";
  if (Dv && (Dv.dps || []).length) {
    const mx = Math.max(...Dv.dps), S = Dv.safety;
    div = `<div class="card pad"><h3>Dividendenhistorie <span class="stamp">je Aktie, ${esc(Dv.currency)}</span></h3>
      <div class="db">${Dv.years.map((y, i) => { const step = Dv.years.length > 12 ? 5 : Dv.years.length > 6 ? 2 : 1, show = (Dv.years.length - 1 - i) % step === 0;
        return `<div class="db-c" title="${y}: ${nf(Dv.dps[i], Dv.dps[i] < 1 ? 3 : 2)} ${esc(Dv.currency)}"><i style="height:${Dv.dps[i] / mx * 100}%"></i><small>${show ? y : "&nbsp;"}</small></div>`; }).join("")}</div>
      <dl class="dv-stats">
        <div><dt>Wachstum 5 J. p. a.</dt><dd class="num">${pc(Dv.g5, 1, true)}</dd></div>
        <div><dt>Wachstum 10 J. p. a.</dt><dd class="num">${pc(Dv.g10, 1, true)}</dd></div>
        <div><dt>Jahre ohne Kürzung</dt><dd class="num">${Dv.streak ?? "–"}</dd></div>
        <div><dt>Ausschüttungsquote</dt><dd class="num">${Dv.payout?.length ? pc(Dv.payout[Dv.payout.length - 1][1], 0) : "–"}</dd></div>
      </dl>
      ${S ? `<div class="dv-safe ${S.label}"><b>Dividendensicherheit: ${esc(S.label)}</b><span>${esc(S.reasons.join(" · "))}</span></div>` : ""}</div>`;
  }
  let hold = "";
  if (Ho && (Ho.institutions != null || Ho.insiders != null)) {
    const inst = Math.max(0, Math.min(1, Ho.institutions || 0)), ins = Math.max(0, Math.min(1 - inst, Ho.insiders || 0)), free = Math.max(0, 1 - inst - ins);
    const R = 42, C = 2 * Math.PI * R; let off = 0;
    const seg = (v, col) => { const s_ = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${col}" stroke-width="18" stroke-dasharray="${(v * C).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off * C).toFixed(2)}" transform="rotate(-90 60 60)"/>`; off += v; return s_; };
    hold = `<div class="card pad"><h3>Aktionärsstruktur</h3>
      <div class="ho"><svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Institutionen ${pc(inst, 0)}, Insider ${pc(ins, 0)}, Streubesitz ${pc(free, 0)}">
        <circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--track)" stroke-width="18"/>
        ${seg(inst, "var(--accent)")}${seg(ins, "var(--sma50)")}${seg(free, "var(--text-3)")}</svg>
        <ul class="ho-l"><li><i style="background:var(--accent)"></i>Institutionen <b class="num">${pc(inst, 1)}</b></li>
          <li><i style="background:var(--sma50)"></i>Insider <b class="num">${pc(ins, 1)}</b></li>
          <li><i style="background:var(--text-3)"></i>Übrige / Privatanleger <b class="num">${pc(free, 1)}</b></li>
          ${Ho.count ? `<li class="stamp">${nf(Ho.count, 0)} institutionelle Anleger</li>` : ""}</ul></div>
      ${(Ho.top || []).length ? `<div class="stamp" style="margin:10px 0 4px">Größte institutionelle Aktionäre</div>
        ${Ho.top.map(t => `<div class="ho-top"><span>${esc(t.name)}</span><b class="num">${pc(t.pct, 2)}</b></div>`).join("")}` : ""}</div>`;
  }
  if (!bal && !div && !hold) return "";
  return `<h2 class="section" id="bilanz">Bilanz, Dividende & Aktionäre</h2>
    <p class="section-sub">Wie solide das Unternehmen finanziert ist, wie verlässlich es ausschüttet und wem es gehört.</p>
    <div class="an-grid">${bal}${div}${hold}</div>`;
}

/* Abo (manuelle Zahlung) */
const SUB_LABEL = {aktiv: "aktiv", gekündigt: "gekündigt", angefragt: "angefragt", abgelaufen: "abgelaufen", inaktiv: "nicht aktiv"};
const subDate = ts => ts ? new Date(ts * 1000).toLocaleDateString("de-DE") : "–";
async function loadSub() {
  const box = $("#sub-box"); if (!box) return;
  let S;
  try { S = await api("/api/subscription"); } catch (e) { box.textContent = "Abo-Status nicht verfügbar."; return; }
  renderSub(S);
}
function renderSub(S) {
  const box = $("#sub-box"); if (!box) return;
  const status = S.state === "aktiv" ? `<b style="color:var(--pos)">Aktiv</b> bis ${subDate(S.paid_until)}`
    : S.state === "gekündigt" ? `<b style="color:var(--neu)">Gekündigt</b> – läuft noch bis ${subDate(S.paid_until)}`
    : S.state === "angefragt" ? `<b style="color:var(--accent)">Angefragt</b> am ${subDate(S.requested)} – wartet auf Zahlungseingang`
    : S.state === "abgelaufen" ? `<b style="color:var(--neg)">Abgelaufen</b> am ${subDate(S.paid_until)}` : `<b>Nicht aktiv</b>`;
  const info = `<div class="sub-info"><b>So bezahlst du</b><p>${esc(S.payment_info).replace(/\n/g, "<br>")}</p></div>`;
  box.className = "";
  box.innerHTML = `<div class="sub-status">${status}</div>
    <p class="stamp" style="margin:6px 0 10px">Mit ${S.price} € pro Monat unterstützt du den Betrieb von Aktien-Check. Derzeit bleiben alle Funktionen für alle nutzbar.</p>
    ${S.state === "angefragt" || S.state === "inaktiv" || S.state === "abgelaufen" ? info : ""}
    <div class="modal-actions" style="justify-content:flex-start;margin-top:10px">
      ${S.state === "inaktiv" || S.state === "abgelaufen" ? `<button class="btn primary" id="sub-req">Abo für ${S.price} € / Monat anfragen</button>` : ""}
      ${S.state === "angefragt" ? `<button class="btn" id="sub-cancel">Anfrage zurückziehen</button>` : ""}
      ${S.state === "aktiv" ? `<button class="btn" id="sub-cancel">Abo kündigen</button>` : ""}
    </div><div class="form-msg" id="sub-msg"></div>`;
  const act = async (a_, txt) => {
    try { const r = await api("/api/subscription", {action: a_}); renderSub(r); const m = $("#sub-msg"); m.textContent = txt; m.className = "form-msg ok"; }
    catch (e) { const m = $("#sub-msg"); m.textContent = e.message; m.className = "form-msg err"; }
  };
  const rq = $("#sub-req"); if (rq) rq.onclick = () => act("request", "Anfrage gesendet – der Administrator wurde benachrichtigt.");
  const cn = $("#sub-cancel"); if (cn) cn.onclick = () => {
    if (S.state === "aktiv" && !confirm(`Abo kündigen? Es läuft noch bis ${subDate(S.paid_until)} und verlängert sich danach nicht.`)) return;
    act("cancel", S.state === "aktiv" ? "Gekündigt – das Abo läuft bis zum Ende des bezahlten Zeitraums." : "Anfrage zurückgezogen.");
  };
}

/* Trefferquote der eigenen Empfehlungen */
let trkScope = "me";
const GROUP_COL = {Kaufen: "var(--pos)", Halten: "var(--neu)", Verkaufen: "var(--neg)"};
async function showTrack() {
  runId++; wlView = false;
  $("#subnav").style.display = "none";
  navTo("?view=trefferquote");
  window.scrollTo({top: 0});
  $("#out").innerHTML = `<div class="loading"><div class="spinner"></div><b>Werte Empfehlungen aus …</b>
    <div class="stamp">Kursverläufe aller bisher analysierten Werte werden geladen – beim ersten Mal bis zu 30 Sekunden.</div></div>`;
  try {
    const r = await fetch("/api/track" + (trkScope === "all" ? "?scope=all" : ""));
    if (r.status === 401) return toLogin();
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    renderTrack(d);
  } catch (e) {
    $("#out").innerHTML = `<div class="card pad">Auswertung nicht möglich: ${esc(e.message || "")}</div>`;
  }
}
function renderTrack(d) {
  const S = d.signals || [];
  const sgn = x => x == null ? "–" : pc(x, 1, true);
  const col = x => x == null ? "" : `style="color:${x >= 0 ? "var(--pos)" : "var(--neg)"}"`;
  const hit = (g, st) => st.beat == null ? null : g === "Kaufen" ? st.beat : g === "Verkaufen" ? 1 - st.beat : null;
  const groups = ["Kaufen", "Halten", "Verkaufen"];
  const H = d.horizons || {};
  const matured = Object.values(H["3M"] || {}).reduce((a, x) => a + (x.n_ex || 0), 0);
  const few = S.length < 30 || matured < 15;
  const spread = k => { const b = H[k]?.Kaufen?.excess, v = H[k]?.Verkaufen?.excess; return b != null && v != null ? b - v : null; };
  $("#out").innerHTML = `
    <div class="wl-head">
      <div><div class="eyebrow">${trkScope === "all" ? "Alle Benutzer" : ME?.multi ? "Konto " + esc(ME.user) : "Deine Analysen"}</div>
        <h1>Trefferquote <span class="stamp" style="font-size:15px">${S.length} Signale${d.since ? " seit " + new Date(d.since).toLocaleDateString("de-DE") : ""}</span></h1></div>
      <div class="wl-actions">
        ${ME?.admin ? `<div class="seg" id="trkscope"><button data-s="me" class="${trkScope === "me" ? "on" : ""}">Meine</button><button data-s="all" class="${trkScope === "all" ? "on" : ""}">Alle Benutzer</button></div>` : ""}
        <button class="btn" id="trkback">Zur Startseite</button>
      </div>
    </div>
    <p class="section-sub" style="margin-top:0">Ein <b>Signal</b> entsteht bei der ersten Analyse einer Aktie und bei jedem Wechsel zwischen Kaufen, Halten und Verkaufen.
      Gemessen wird die Kursentwicklung ab dem Signal (ohne Dividenden) im Vergleich zum Heimatindex (DAX, S&amp;P 500 …). Gute Empfehlungen:
      <b>Kaufen</b> schlägt den Index, <b>Verkaufen</b> läuft schlechter als der Index.</p>
    ${few ? `<div class="note">Noch wenig Daten: Aussagekräftig wird die Auswertung erst ab etwa 30 Signalen, von denen viele älter als 3 Monate sind.
      Einzelne Ausreißer verzerren die Durchschnitte bis dahin stark.</div>` : ""}
    <div class="trk-groups">${groups.map(g => { const st = d.groups?.[g] || {}; const h = hit(g, st); return `
      <div class="card trk-g" style="border-top:3px solid ${GROUP_COL[g]}">
        <div class="eyebrow" style="color:${GROUP_COL[g]}">${g}</div>
        <div class="trk-n">${st.n || 0} <small>Signale</small></div>
        <dl>
          <div><dt>Ø Rendite seit Signal</dt><dd class="num" ${col(st.ret)}>${sgn(st.ret)}</dd></div>
          <div><dt>Ø gegenüber Index</dt><dd class="num" ${col(st.excess)}>${sgn(st.excess)}</dd></div>
          <div><dt>Trefferquote</dt><dd class="num">${h == null ? (g === "Halten" ? "<span class='stamp'>nicht bewertet</span>" : "–") : pc(h, 0)}${h != null ? ` <span class="stamp">(${st.n_ex})</span>` : ""}</dd></div>
        </dl>
      </div>`; }).join("")}</div>
    <h2 class="section">Nach Haltedauer</h2>
    <p class="section-sub">Durchschnittliche Über- oder Unterrendite gegenüber dem Index, gemessen eine feste Zeit nach dem Signal. Entscheidend ist die letzte Spalte:
      Ist sie positiv, haben Kauf-Empfehlungen besser abgeschnitten als Verkaufs-Empfehlungen.</p>
    <div class="card peer-scroll"><table class="trk">
      <thead><tr><th>Haltedauer</th>${groups.map(g => `<th>${g}</th>`).join("")}<th>Kaufen − Verkaufen</th></tr></thead>
      <tbody>${["1M", "3M", "6M", "12M"].map(k => `<tr><td>${{"1M": "1 Monat", "3M": "3 Monate", "6M": "6 Monate", "12M": "12 Monate"}[k]}</td>
        ${groups.map(g => { const st = H[k]?.[g] || {}; return `<td class="num" ${col(st.excess)}>${sgn(st.excess)} <span class="stamp">(${st.n_ex || 0})</span></td>`; }).join("")}
        <td class="num" ${col(spread(k))}><b>${sgn(spread(k))}</b></td></tr>`).join("")}</tbody>
    </table></div>
    <h2 class="section">Alle Signale</h2>
    <div class="card peer-scroll"><table class="trk">
      <thead><tr><th>Datum</th><th>Aktie</th><th>Empfehlung</th><th>Kurs damals</th><th>Rendite</th><th>Index</th><th>vs. Index</th><th>Status</th></tr></thead>
      <tbody>${S.length ? S.slice(0, 200).map(x => `<tr>
        <td class="num">${new Date(x.date).toLocaleDateString("de-DE")}</td>
        <td><a href="?q=${encodeURIComponent(x.symbol)}" data-q="${esc(x.symbol)}" class="trk-sym">${esc(x.symbol)}</a></td>
        <td><span style="color:${GROUP_COL[x.group] || "inherit"};font-weight:600">${esc(x.label)}</span></td>
        <td class="num">${nf(x.price)}</td>
        <td class="num" ${col(x.ret)}>${sgn(x.ret)}</td>
        <td class="num">${x.bench ? `${sgn(x.bench_ret)} <span class="stamp">${esc(x.bench)}</span>` : "<span class='stamp'>kein Index</span>"}</td>
        <td class="num" ${col(x.excess)}><b>${sgn(x.excess)}</b></td>
        <td class="stamp">${x.active ? `aktiv · ${x.days} T.` : `beendet nach ${x.days} T.`}</td></tr>`).join("")
        : `<tr><td colspan="8" class="stamp" style="padding:18px">Noch keine Signale – analysiere ein paar Aktien, dann füllt sich die Liste automatisch.</td></tr>`}</tbody>
    </table></div>
    <p class="stamp" style="margin-top:10px">Kurse in Handelswährung, ohne Dividenden und Gebühren. Vergangene Treffer sind keine Garantie für die Zukunft.</p>`;
  $("#trkback").onclick = () => goHome();
  document.querySelectorAll("#trkscope button").forEach(b => b.onclick = () => { trkScope = b.dataset.s; showTrack(); });
  document.querySelectorAll(".trk-sym").forEach(a => a.onclick = e => { e.preventDefault(); $("#q").value = a.dataset.q; run(a.dataset.q); });
}

/* Navigation: Startseite, Browser-Verlauf und Zurück-Geste */
function navTo(url) {
  const target = new URL(url, location.href);
  if (target.search === location.search) return;  // gleiche Seite (z. B. nach „Zurück“) -> kein doppelter Eintrag
  history.pushState(null, "", target.search || location.pathname);
}
function goHome() {
  runId++;
  if (typeof scrTimer !== "undefined") clearTimeout(scrTimer);
  if (typeof closeGl === "function") closeGl();
  $("#q").value = "";
  if (location.search) history.pushState(null, "", location.pathname);
  welcome();
  window.scrollTo({top: 0});
}
function route() {
  const ps = new URLSearchParams(location.search);
  const pre = ps.get("q");
  if (ps.get("import")) wlImport(ps.get("import"));
  else if (ps.get("view") === "watchlist") showWatchlist();
  else if (ps.get("view") === "trefferquote") showTrack();
  else if (ps.get("view") === "glossar") showGlossary();
  else if (ps.get("view") === "screener") showScreener();
  else if (ps.get("view") === "admin") showAdmin();
  else if (pre) { $("#q").value = pre; run(pre); }
  else { runId++; $("#q").value = ""; welcome(); }
}
window.addEventListener("popstate", () => route());
document.addEventListener("click", e => {
  if (e.target.closest("#homebtn") || (e.target.closest("#brand") && !e.ctrlKey && !e.metaKey)) { e.preventDefault(); goHome(); }
});

/* Run */
let runId = 0;
async function run(q) {
  const id = ++runId;
  wlView = false;
  $("#subnav").style.display = "none";
  const steps = ["Unternehmen finden", "Kurs- und Bilanzdaten laden", "Nachrichten aus Tier 1–3 sammeln", "Kategorien bewerten"];
  $("#out").innerHTML = `<div class="loading"><div class="spinner"></div>
    <b>Analysiere „${esc(q)}“</b><div class="stamp">Dauert in der Regel 10–25 Sekunden</div>
    <ul class="steps">${steps.map(s => `<li>${s}</li>`).join("")}</ul></div>`;
  const lis = [...document.querySelectorAll(".steps li")];
  const timers = [1500, 5000, 10000].map((t, i) => setTimeout(() => lis[i]?.classList.add("done"), t));
  try {
    const r = await fetch("/api/analyze?q=" + encodeURIComponent(q));
    if (r.status === 401) return toLogin(q);
    const d = await r.json();
    if (id !== runId) return;
    if (!r.ok) throw new Error(d.error || "Unbekannter Fehler");
    render(d);
    wlUpsert(d);
    window.scrollTo({top: 0});
    navTo("?q=" + encodeURIComponent(d.symbol));
  } catch (e) {
    if (id !== runId) return;
    $("#out").innerHTML = `<div class="card error"><b>Analyse nicht möglich</b><span class="stamp">${esc(e.message)}</span></div>`;
  } finally { timers.forEach(clearTimeout); }
}

function meter(score) {
  if (score == null) return `<div class="meter"></div>`;
  const w = Math.min(1, Math.abs(score)) * 50;
  const pos = score >= 0 ? `left:50%;width:${w}%` : `left:${50 - w}%;width:${w}%`;
  return `<div class="meter"><i class="${tone(score)}" style="${pos}"></i></div>`;
}

      if (sym === CHART.sym && CHART.range === rng) $("#ch-wrap").innerHTML = `<div class="chart-msg">Kursverlauf nicht verfügbar.</div>`;
      return;
    }
  }
  if (CHART.range === rng && sym === CHART.sym) drawChart();
}
function initChart(sym) {
  CHART.sym = sym; CHART.data = {};

  document.querySelectorAll("#ch-type button").forEach(b => b.onclick = () => {

/* Erfolgsrechnung: Umsatz + Reinertrag (Balken, rechte Achse) und Nettomarge (Linie, linke Achse) */
const INC = {sym: null, freq: "annual", data: {}, ro: null};
try { INC.freq = localStorage.getItem("ac-inc-freq") === "quarterly" ? "quarterly" : "annual"; } catch (e) {}
function incHead(p, D, unit) {
  const [v, u] = big(p.revenue);
  $("#inc-val").innerHTML = `${v}<small>${u} ${esc(D.currency)} Umsatz</small>`;
  const mc = p.margin >= 0 ? "var(--pos)" : "var(--neg)";
  $("#inc-sub").innerHTML = `<span style="color:var(--text-2);margin:0">Reinertrag ${big(p.net_income).join(" ")} ·
    Netto <b style="color:${mc}">${pc(p.margin, 1)}</b>${p.op_margin != null ? ` · Operativ <b style="color:${p.op_margin >= 0 ? "var(--pos)" : "var(--neg)"}">${pc(p.op_margin, 1)}</b>` : ""}</span><span>${esc(p.label)}</span>`;
}
function drawIncome() {
  const wrap = $("#inc-wrap"); if (!wrap) return;
  const D = INC.data[INC.freq]; if (!D) return;
  const P = D.periods, n = P.length;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const m = {l: 44, r: 62, t: 12, b: 28};
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  // Rechte Achse: Beträge (Einheit nach größtem Umsatz)
  const maxV = Math.max(...P.map(p => p.revenue));
  const [div, unit] = maxV >= 1e12 ? [1e12, "Bio."] : maxV >= 1e9 ? [1e9, "Mrd."] : [1e6, "Mio."];
  const minV = Math.min(0, ...P.map(p => p.net_income));
  const {ticks, step} = niceTicks(minV / div, maxV / div * 1.04, 5);
  const vLo = Math.min(0, ticks[0]), vHi = ticks[ticks.length - 1] < maxV / div ? ticks[ticks.length - 1] + step : ticks[ticks.length - 1];
  const grid = [...new Set([...ticks.filter(t => t >= vLo), vHi])];
  const Yv = v => m.t + (1 - (v / div - vLo) / (vHi - vLo)) * ph;
  // Linke Achse: Nettomarge, auf dieselben Gitterlinien gelegt
  const hasOp = P.some(p => p.op_margin != null);
  const mg = [...P.map(p => p.margin), ...P.map(p => p.op_margin).filter(v => v != null)];
  let mLo = Math.min(...mg), mHi = Math.max(...mg);
  const mp = (mHi - mLo) * 0.12 || Math.abs(mHi) * 0.2 || 0.05;
  mLo -= mp; mHi += mp;
  const Ym = v => m.t + (1 - (v - mLo) / (mHi - mLo)) * ph;
  const mAt = y => mLo + (1 - (y - m.t) / ph) * (mHi - mLo);
  const cw = pw / n, bw = Math.min(34, cw * 0.3), gap = Math.min(10, cw * 0.08);
  const cx = i => m.l + cw * (i + 0.5);
  const bar = (x, v, cls) => {   // Balken mit gerundetem Ende, am Nullpunkt verankert
    const y0 = Yv(0), y1 = Yv(v), h = Math.abs(y0 - y1), r = Math.min(4, h, bw / 2), up = v >= 0;
    if (h < 0.5) return "";
    const top = up ? y1 : y0, bot = up ? y0 : y1;
    const d = up ? `M${x},${bot}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${bot}Z`
                 : `M${x},${top}V${bot - r}Q${x},${bot} ${x + r},${bot}H${x + bw - r}Q${x + bw},${bot} ${x + bw},${bot - r}V${top}Z`;
    return `<path d="${d}" fill="var(${cls})"/>`;
  };
  const line = P.map((p, i) => `${i ? "L" : "M"}${cx(i).toFixed(1)},${Ym(p.margin).toFixed(1)}`).join("");
  let opLine = "", pen = false;
  P.forEach((p, i) => { if (p.op_margin == null) { pen = false; return; }
    opLine += `${pen ? "L" : "M"}${cx(i).toFixed(1)},${Ym(p.op_margin).toFixed(1)}`; pen = true; });
  const tickV = t => nf(t, step < 1 ? (step < 0.1 ? 2 : 1) : 0);
  const aria = `Erfolgsrechnung ${INC.freq === "annual" ? "jährlich" : "vierteljährlich"}: ` +
    P.map(p => `${p.label} Umsatz ${big(p.revenue).join(" ")}, Reinertrag ${big(p.net_income).join(" ")}, Nettomarge ${pc(p.margin, 1)}` +
      (p.op_margin != null ? `, operative Marge ${pc(p.op_margin, 1)}` : "")).join("; ");
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${P.map((p, i) => `<g class="col" data-i="${i}"><rect class="bg" x="${(m.l + cw * i + 2).toFixed(1)}" y="${m.t}" width="${(cw - 4).toFixed(1)}" height="${ph}" rx="6" fill="transparent"/></g>`).join("")}
    <g class="grid">${grid.map(t => `<line x1="${m.l}" x2="${m.l + pw}" y1="${Yv(t * div).toFixed(1)}" y2="${Yv(t * div).toFixed(1)}"/>`).join("")}</g>
    <g class="axis">
      ${grid.map(t => { const y = Yv(t * div); return `<text x="${W - 2}" y="${(y + 4).toFixed(1)}" text-anchor="end">${tickV(t)} ${unit}</text>
        <text x="2" y="${(y + 4).toFixed(1)}">${nf(mAt(y) * 100, mHi - mLo < 0.08 ? 1 : 0)} %</text>`; }).join("")}
      ${P.map((p, i) => `<text x="${cx(i).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(p.label)}</text>`).join("")}
    </g>
    ${minV < 0 ? `<line class="zero" x1="${m.l}" x2="${m.l + pw}" y1="${Yv(0).toFixed(1)}" y2="${Yv(0).toFixed(1)}"/>` : ""}
    ${P.map((p, i) => bar(cx(i) - bw - gap / 2, p.revenue, "--inc-rev") + bar(cx(i) + gap / 2, p.net_income, "--inc-ni")).join("")}
    ${hasOp ? `<path d="${opLine}" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>
      ${P.map((p, i) => p.op_margin == null ? "" : `<rect x="${(cx(i) - 4).toFixed(1)}" y="${(Ym(p.op_margin) - 4).toFixed(1)}" width="8" height="8" rx="1.5" fill="var(--surface)" stroke="var(--text-2)" stroke-width="2"/>`).join("")}` : ""}
    <path d="${line}" fill="none" stroke="var(--inc-mar)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${P.map((p, i) => `<circle cx="${cx(i).toFixed(1)}" cy="${Ym(p.margin).toFixed(1)}" r="4.5" fill="var(--surface)" stroke="var(--inc-mar)" stroke-width="2"/>`).join("")}
    <rect id="inc-hit" x="${m.l}" y="0" width="${pw}" height="${H}" fill="transparent"/>
  </svg><div class="chart-tip" id="inc-tip"></div>`;
  const last = P[n - 1];
  incHead(last, D);
  $("#inc-foot").innerHTML = `<div class="legend">
      <span style="color:var(--inc-rev)"><i class="box"></i><span style="color:var(--text-2)">Umsatz</span></span>
      <span style="color:var(--inc-ni)"><i class="box"></i><span style="color:var(--text-2)">Reinertrag</span></span>
      <span style="color:var(--inc-mar)"><i class="mar"></i><span style="color:var(--text-2)">Nettomarge %</span></span>
      ${hasOp ? `<span style="color:var(--text-2)"><i class="mar op"></i>Operative Marge %</span>` : ""}
      <span style="color:var(--text-3)">Margen: linke Achse</span></div>
    <span>${INC.freq === "annual" ? "Geschäftsjahre" : "Quartale (Monat = Periodenende)"} · Beträge in ${unit} ${esc(D.currency)} · Quelle: Yahoo Finance</span>`;
  const hit = $("#inc-hit"), tip = $("#inc-tip"), cols = wrap.querySelectorAll(".col");
  const move = e => {
    const r = hit.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - r.left) / r.width) * n)));
    const p = P[i];
    cols.forEach(c => c.classList.toggle("on", +c.dataset.i === i));
    tip.innerHTML = `<b>${esc(p.label)}</b>
      <span style="display:block">Umsatz: ${big(p.revenue).join(" ")} ${esc(D.currency)}</span>
      <span style="display:block">Reinertrag: ${big(p.net_income).join(" ")} ${esc(D.currency)}</span>
      ${p.op_income != null ? `<span style="display:block">Operatives Ergebnis: ${big(p.op_income).join(" ")} ${esc(D.currency)}</span>` : ""}
      <span style="display:block">Nettomarge: ${pc(p.margin, 1)}</span>
      ${p.op_margin != null ? `<span style="display:block">Operative Marge: ${pc(p.op_margin, 1)}</span>` : ""}`;
    tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, cx(i) - tw / 2)) + "px";
    tip.style.top = Math.max(0, Math.min(Yv(p.revenue), Ym(p.margin), p.op_margin != null ? Ym(p.op_margin) : Infinity) - tip.offsetHeight - 12) + "px";
    incHead(p, D);
  };
  const leave = () => { tip.style.display = "none"; cols.forEach(c => c.classList.remove("on")); incHead(last, D); };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
  hit.addEventListener("pointercancel", leave);
}
async function loadIncome(freq) {
  INC.freq = freq;
  try { localStorage.setItem("ac-inc-freq", freq); } catch (e) {}
  document.querySelectorAll("#inc-seg button").forEach(b => b.classList.toggle("on", b.dataset.f === freq));
  const sym = INC.sym;
  if (!INC.data[freq]) {
    $("#inc-wrap").innerHTML = `<div class="chart-msg">Lade Geschäftszahlen …</div>`;
    try {
      const r = await fetch(`/api/income?q=${encodeURIComponent(sym)}&freq=${freq}`);
      if (r.status === 401) return toLogin();
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      if (sym !== INC.sym) return;
      INC.data[freq] = d;
    } catch (e) {
      if (sym === INC.sym && INC.freq === freq) {
        $("#inc-wrap").innerHTML = `<div class="chart-msg">Keine Geschäftszahlen verfügbar.</div>`;
        $("#inc-val").textContent = "–"; $("#inc-sub").innerHTML = ""; $("#inc-foot").innerHTML = "";
      }
      return;
    }
  }
  if (INC.freq === freq && sym === INC.sym) drawIncome();
}
function initIncome(sym) {
  INC.sym = sym; INC.data = {};
  document.querySelectorAll("#inc-seg button").forEach(b => b.onclick = () => loadIncome(b.dataset.f));
  INC.ro?.disconnect();
  let last = 0;
  INC.ro = new ResizeObserver(() => { const w = $("#inc-wrap")?.clientWidth; if (w && w !== last) { last = w; drawIncome(); } });
  INC.ro.observe($("#inc-wrap"));
  loadIncome(INC.freq);
}

/* Termine */

function evWhen(days) {

}

    : `<div class="empty">Für diese Aktie sind keine Termine bekannt.</div>`}

/* Verlauf der Empfehlung */
function historyCard(d) {
  const H = d.history || [];
  const changes = [];
  for (let i = 1; i < H.length; i++) if (H[i][2] !== H[i - 1][2]) changes.push([H[i - 1], H[i]]);
  const fmtD = s => new Date(s + "T12:00:00").toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "numeric"});
  const scoreTxt = v => (v > 0 ? "+" : "") + nf(v, 1);
  let body;
  if (H.length < 2) {
    body = `<div class="hist-empty">Der Verlauf startet ${H.length ? `am <b>${fmtD(H[0][0])}</b> mit <b>${esc(H[0][2])}</b> (Score ${scoreTxt(H[0][1])})` : "mit dieser Analyse"}.
      Jede weitere Analyse an einem anderen Tag fügt einen Punkt hinzu – auch „Alle aktualisieren“ in der Watchlist und die
      automatischen Prüfungen eines Preisalarms mit „Empfehlungswechsel“. Der Verlauf ist auf allen deinen Geräten derselbe.</div>`;
  } else {
    const first = H[0], last = H[H.length - 1];
    body = `<div class="kv" style="margin:0 0 10px">
        <span>Seit ${fmtD(first[0])}: <b>${esc(first[2])} → ${esc(last[2])}</b></span>
        <span>Score <b class="num">${scoreTxt(first[1])} → ${scoreTxt(last[1])}</b></span>
        <span>${H.length} Analysetage · ${changes.length} ${changes.length === 1 ? "Wechsel" : "Wechsel"}</span></div>
      <div class="hist-wrap" id="hist-wrap"></div>
      ${changes.length ? `<ul class="hist-changes">${changes.slice(-6).reverse().map(([a, b]) => `<li>
        <span><b>${esc(a[2])} → ${esc(b[2])}</b> <span class="stamp">Score ${scoreTxt(a[1])} → ${scoreTxt(b[1])}</span></span>
        <span class="when">${fmtD(b[0])}${b[3] ? " · Kurs " + nf(b[3]) + " " + esc(d.currency) : ""}</span></li>`).join("")}</ul>` : ""}`;
  }
  return `<section class="card hist-card" id="verlauf" aria-label="Verlauf der Empfehlung">
    <div class="ev-head"><div><div class="eyebrow">Verlauf</div><h3>Entwicklung der Empfehlung</h3></div></div>
    <div class="hist-body">${body}</div></section>`;
}
function drawHistory(d) {
  const wrap = $("#hist-wrap"); if (!wrap) return;
  const H = d.history, n = H.length;
  const W = wrap.clientWidth, Hh = wrap.clientHeight;
  const m = {l: 4, r: 40, t: 6, b: 22};
  const pw = W - m.l - m.r, ph = Hh - m.t - m.b;
  const t0 = new Date(H[0][0]).getTime(), t1 = new Date(H[n - 1][0]).getTime() || t0 + 1;
  const X = s => m.l + ((new Date(s).getTime() - t0) / Math.max(1, t1 - t0)) * pw;
  const lo = Math.min(-40, ...H.map(h => h[1] - 8)), hi = Math.max(40, ...H.map(h => h[1] + 8));
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * ph;
  const zone = (a, b, cls, lbl, col) => {
    const y1 = Y(Math.min(hi, b)), y2 = Y(Math.max(lo, a));
    return y2 - y1 > 2 ? `<rect class="${cls}" x="${m.l}" y="${y1.toFixed(1)}" width="${pw}" height="${(y2 - y1).toFixed(1)}"/>
      ${y2 - y1 > 16 ? `<text class="zlbl" x="${m.l + 6}" y="${(y1 + 13).toFixed(1)}" fill="${col}">${lbl}</text>` : ""}` : "";
  };
  // Stufenlinie: Empfehlung gilt bis zur nächsten Analyse
  let path = `M${X(H[0][0]).toFixed(1)},${Y(H[0][1]).toFixed(1)}`;
  for (let i = 1; i < n; i++) path += `H${X(H[i][0]).toFixed(1)}V${Y(H[i][1]).toFixed(1)}`;
  const tone = g => g >= 15 ? "var(--pos)" : g <= -15 ? "var(--neg)" : "var(--neu)";
  const ticks = [-50, 0, 50].filter(v => v > lo && v < hi);
  const fmtS = s => new Date(s + "T12:00:00").toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit"});
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Score-Verlauf von ${nf(H[0][1], 1)} auf ${nf(H[n - 1][1], 1)}">
    ${zone(15, 999, "zone-pos", "Kaufen", "var(--pos)")}${zone(-15, 15, "zone-neu", "Halten", "var(--neu)")}${zone(-999, -15, "zone-neg", "Verkaufen", "var(--neg)")}
    <g class="axis">${ticks.map(t => `<text x="${W - 4}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end">${t > 0 ? "+" : ""}${t}</text>`).join("")}
      <text x="${m.l}" y="${Hh - 5}">${fmtS(H[0][0])}</text><text x="${m.l + pw}" y="${Hh - 5}" text-anchor="end">${fmtS(H[n - 1][0])}</text></g>
    <path d="${path}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round"/>
    ${H.map(h => `<circle class="hp" cx="${X(h[0]).toFixed(1)}" cy="${Y(h[1]).toFixed(1)}" r="${n > 60 ? 3 : 4.5}" fill="${tone(h[1])}"/>`).join("")}
    <line id="hist-x" stroke="var(--text-3)" y1="${m.t}" y2="${m.t + ph}" style="display:none"/>
    <rect id="hist-hit" x="${m.l}" y="0" width="${pw}" height="${Hh}" fill="transparent"/>
  </svg><div class="chart-tip" id="hist-tip"></div>`;
  const hit = $("#hist-hit"), tip = $("#hist-tip"), xl = $("#hist-x");
  const move = e => {
    const r = hit.getBoundingClientRect(), x = e.clientX - r.left + m.l;
    let best = 0;
    H.forEach((h, i) => { if (Math.abs(X(h[0]) - x) < Math.abs(X(H[best][0]) - x)) best = i; });
    const h = H[best], px = X(h[0]);
    xl.setAttribute("x1", px); xl.setAttribute("x2", px); xl.style.display = "";
    tip.innerHTML = `<b>${esc(h[2])} · Score ${(h[1] > 0 ? "+" : "") + nf(h[1], 1)}</b><span>${new Date(h[0] + "T12:00:00").toLocaleDateString("de-DE")}${h[3] ? " · Kurs " + nf(h[3]) + " " + esc(d.currency) : ""}</span>`;
    tip.style.display = "block";
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(W - tw, px - tw / 2)) + "px";
    tip.style.top = Math.max(0, Y(h[1]) - tip.offsetHeight - 12) + "px";
  };
  const leave = () => { tip.style.display = "none"; xl.style.display = "none"; };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave); hit.addEventListener("pointercancel", leave);
}

/* Konkurrenzvergleich */
function cryptoPeersSection(d) {
  const C = d.competitors || {}, peers = C.peers || [], own = C.own || {}, S = C.summary || {};
  const head = `<h2 class="section" id="konkurrenz">Vergleich mit großen Kryptowährungen</h2>
    <p class="section-sub">Die ${peers.length} größten Kryptowährungen nach Marktwert (ohne Stablecoins). Zeile antippen, um sie zu analysieren.</p>`;
  if (!peers.length) return head + `<div class="card empty">Vergleichsdaten sind gerade nicht verfügbar (CoinGecko).</div>`;
  const pcf = v => v == null ? "–" : `<span class="${v < 0 ? "neg" : ""}">${pc(v, 1, true)}</span>`;
  const cap = (v, cur) => { if (v == null) return "–"; const [n, u] = big(v); return `${n} ${u}<small>${esc(cur || "")}</small>`; };
  const verdict = (key, label) => {
    const x = S[key] || {}, ov = own[key];
    if (ov == null || !x.n) return `<div><dt>${label}</dt><dd>–</dd></div>`;
    const good = x.beats >= Math.ceil(x.n / 2);
    return `<div><dt>${label}</dt><dd class="num">${pc(ov, 1, true)} <span class="stamp">vs. Median ${pc(x.median, 1, true)}</span></dd>
      <small style="color:${good ? "var(--pos)" : "var(--neg)"}">${key === "ath_change" ? (good ? "näher am Hoch als" : "weiter vom Hoch als") : (good ? "besser als" : "schwächer als")} ${x.beats === null ? "–" : (good ? x.beats : x.n - x.beats)} von ${x.n}</small></div>`;
  };
  const row = (r, cls) => `<tr class="${cls}" ${cls === "peer" ? `data-s="${esc(r.symbol)}"` : ""}>

    <div class="peer-scroll"><table class="peers">

      <tbody>${row(own, "own")}${peers.map(r => row(r, "peer")).join("")}
        <tr class="med"><td>Median Vergleichsgruppe</td><td></td><td>${S.perf_30d?.median == null ? "–" : pc(S.perf_30d.median, 1, true)}</td>

      </tbody></table></div>
    <div class="peer-foot">Quelle: ${esc(C.source || "CoinGecko")}. Marktwert in Euro.</div>

}

const COPY_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
function aboutSection(d) {

  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } };
  const date = iso => { const t = new Date(iso + "T00:00:00"); return isNaN(t) ? iso : t.toLocaleDateString("de-DE", {day: "numeric", month: "short", year: "numeric"}); };
  const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
  const rows = [
    ["Sektor", p.sector || d.sector],
    ["Branche", p.industry || d.industry],
    ["CEO", p.ceo],
    ["Webseite", safeUrl(p.website || d.website) ? `<a href="${esc(safeUrl(p.website || d.website))}" target="_blank" rel="noopener">${esc(host(p.website || d.website))}</a>` : "", true],
    ["Hauptsitz", p.hq],
    ["Gegründet", p.founded],
    [p.ipo_label === "Erster Handelstag" ? "Erster Handelstag" : "IPO-Datum", p.ipo ? date(p.ipo) : "", false,
     p.ipo_label === "Erster Handelstag" ? "an diesem Börsenplatz, laut Yahoo" : ""],
    ["Mitarbeiter", p.employees ? nf(p.employees, 0) : ""],
    ["ISIN", p.isin, false, p.isin_home ? "der Aktie an der Heimatbörse" : "", true],
    ["CUSIP", p.cusip, false, "", true],

  ].filter(r => r[1]);
  if (!rows.length) return "";
  return `<h2 class="section" id="ueber">Über ${esc(d.name)}</h2>
  <p class="section-sub">Stammdaten des Unternehmens. Quellen: ${esc((p.sources || []).join(", "))}.</p>
  <div class="card about"><dl>${rows.map(([k, v, html, hint, copy]) => `<div class="about-row">
      <dt>${esc(k)}${hint ? `<small>${esc(hint)}</small>` : ""}</dt>
      <dd>${html ? v : `<span class="${copy ? "num mono" : ""}">${esc(v)}</span>`}${copy ? `<button class="copy-btn" data-copy="${esc(v)}" aria-label="${esc(k)} kopieren" title="Kopieren">${COPY_SVG}</button>` : ""}</dd>
    </div>`).join("")}</dl></div>`;

document.addEventListener("click", e => {
  const b = e.target.closest(".copy-btn"); if (!b) return;
  const v = b.dataset.copy;
  const done = () => { toast(`${v} kopiert`); b.classList.add("ok"); setTimeout(() => b.classList.remove("ok"), 1200); };
  const legacy = () => {  // Ersatzweg, wenn die Zwischenablage-Schnittstelle gesperrt ist
    const t = document.createElement("textarea"); t.value = v; t.setAttribute("readonly", "");
    t.style.cssText = "position:absolute;left:-9999px"; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (err) {} t.remove();
    ok ? done() : toast("Kopieren nicht möglich");
  };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(v).then(done, legacy); else legacy();
});

function etfSection(d) {
  const E = d.etf || {};
  const top = E.top || [], sec = E.sectors || [];
  const head = `<h2 class="section" id="konkurrenz">Zusammensetzung</h2>
    <p class="section-sub">Größte Positionen und Branchenmix des ETFs${E.family ? " · Anbieter " + esc(E.family) : ""}.</p>`;
  if (!top.length && !sec.length) return head + `<div class="card empty">Die Zusammensetzung war nicht abrufbar.</div>`;
  const maxT = Math.max(...top.map(x => x.weight), 0.01), maxS = Math.max(...sec.map(x => x.weight), 0.01);
  const bar = (w, max) => `<span class="etf-bar"><i style="width:${Math.max(2, w / max * 100)}%"></i></span>`;
  return head + `<div class="etf-grid">
    ${top.length ? `<div class="card pad"><h3>Top ${top.length} Positionen</h3>${top.map(x => `<div class="etf-row">
      <span class="etf-name"><a href="?q=${encodeURIComponent(x.symbol)}" data-q="${esc(x.symbol)}" class="etf-link">${esc(x.name)}</a></span>
      ${bar(x.weight, maxT)}<span class="num etf-w">${pc(x.weight, 1)}</span></div>`).join("")}
      <div class="stamp" style="margin-top:8px">Zusammen ${pc(top.reduce((a, x) => a + x.weight, 0), 1)} des Fonds</div></div>` : ""}
    ${sec.length ? `<div class="card pad"><h3>Branchen</h3>${sec.map(x => `<div class="etf-row">
      <span class="etf-name">${esc(x.name)}</span>${bar(x.weight, maxS)}<span class="num etf-w">${pc(x.weight, 1)}</span></div>`).join("")}</div>` : ""}
  </div>`;
}
document.addEventListener("click", e => {
  const a = e.target.closest(".etf-link"); if (!a) return;
  e.preventDefault(); $("#q").value = a.dataset.q; run(a.dataset.q);
});

function peersSection(d) {
  if (d.asset === "crypto") return cryptoPeersSection(d);
  if (d.asset === "etf") return etfSection(d);
  const C = d.competitors || {};
  const peers = C.peers || [], own = C.own || {}, S = C.summary || {};
  const head = `<h2 class="section" id="konkurrenz">Konkurrenzvergleich</h2>
    <p class="section-sub">${peers.length ? `${peers.length} Wettbewerber${C.industry ? " aus der Branche „" + esc(C.industry) + "“" : ""} im Vergleich. Zeile antippen, um den Wettbewerber zu analysieren.` : "Vergleich mit Unternehmen derselben Branche."}</p>`;
  if (!peers.length) return head + `<div class="card empty">Für diese Aktie konnten keine vergleichbaren Wettbewerber ermittelt werden.</div>`;
  const pcf = v => v == null ? "–" : `<span class="${v < 0 ? "neg" : ""}">${pc(v, 1)}</span>`;
  const kgv = v => v == null ? "–" : nf(v, 1);
  const cap = (v, cur) => { if (v == null) return "–"; const [n, u] = big(v); return `${n} ${u}<small>${esc(cur || "")}</small>`; };
  const verdict = (key, label, lowBetter) => {
    const x = S[key] || {}, ov = own[key];
    if (ov == null || !x.n) return `<div><dt>${label}</dt><dd>–</dd><small style="color:var(--text-3)">keine Vergleichsdaten</small></div>`;
    const good = x.beats >= Math.ceil(x.n / 2);
    const word = lowBetter ? (good ? "günstiger" : "teurer") : (good ? "höher" : "niedriger");
    const fmt = key === "pe" ? kgv : v => pc(v, 1);
    return `<div><dt>${label}</dt><dd class="num">${fmt(ov)} <span class="stamp">vs. Median ${fmt(x.median)}</span></dd>
      <small style="color:${good ? "var(--pos)" : "var(--neg)"}">${word} als ${x.beats} von ${x.n} Wettbewerbern</small></div>`;
  };
  const row = (r, cls) => `<tr class="${cls}" ${cls === "peer" ? `data-s="${esc(r.symbol)}"` : ""}>
      <td>${esc(r.name || r.symbol)}<small>${esc(r.symbol)}${cls === "own" ? " · diese Aktie" : ""}</small></td>
      <td>${cap(r.mcap, r.currency)}</td><td>${kgv(r.pe)}</td><td>${pcf(r.op_m)}</td><td>${pcf(r.growth)}</td></tr>`;
  return head + `<div class="card peer-card">
    <dl class="peer-sum" style="margin:0">${verdict("pe", "KGV", true)}${verdict("op_m", "Operative Marge", false)}${verdict("growth", "Umsatzwachstum", false)}</dl>
    <div class="peer-scroll"><table class="peers">
      <thead><tr><th>Unternehmen</th><th>Börsenwert</th><th>KGV</th><th>Op. Marge</th><th>Wachstum</th></tr></thead>
      <tbody>${row(own, "own")}${peers.map(r => row(r, "peer")).join("")}
        <tr class="med"><td>Median Wettbewerber</td><td></td><td>${kgv(S.pe?.median)}</td><td>${S.op_m?.median == null ? "–" : pc(S.op_m.median, 1)}</td><td>${S.growth?.median == null ? "–" : pc(S.growth.median, 1)}</td></tr>
      </tbody></table></div>
    <div class="peer-foot">Quelle: ${esc(C.source || "–")}. KGV auf Basis der letzten 12 Monate (bei Verlust nicht aussagekräftig, daher „–“);
      Wachstum = Umsatz ggü. Vorjahr. Wettbewerber stammen überwiegend von US-Börsen. ${S.pe?.n >= 3 ? "Die Bewertung nutzt den KGV-Median der Wettbewerber als Vergleichsmaßstab." : ""}</div>
  </div>`;
}

/* PDF-Export über die Druckfunktion des Browsers (Drucklayout siehe @media print) */
function exportPdf(d) {
  const old = document.title;
  const date = new Date().toLocaleDateString("de-DE");
  document.title = `Aktien-Check ${d.name} ${date}`.replace(/[\\/:*?"<>|]/g, "");  // wird zum Dateinamen
  const restore = () => { document.title = old; window.removeEventListener("afterprint", restore); };
  window.addEventListener("afterprint", restore);
  if (isStandalone() && /iPhone|iPad/.test(navigator.userAgent)) {
    toast("Tipp: Im Druckdialog auf „Teilen“ → „In Dateien sichern“ tippen");
  }
  setTimeout(() => { window.print(); setTimeout(restore, 1500); }, 50);
}

      ? [["TER", F.ter != null ? pc(F.ter, 2) : "–"], ["Fondsvolumen", F.aum ? big(F.aum)[0] : "–", F.aum ? `${big(F.aum)[1]} USD` : ""],
         ["KGV Bestände", nf(F.pe, 1)], ["Rendite 1J", pc(F.perf_1y, 1, true)], ["Rendite 5J p. a.", pc(F.cagr5, 1, true)],
         ["Top 10", pc(F.top10, 0), "Anteil"], ["Volatilität 1J", pc(F.vol, 0)]]
      : crypto
      ? [["Marktkapitalisierung", big(F.mcap)[0], `${big(F.mcap)[1]} ${esc(d.currency)}`], ["Rang", F.rank ? "#" + F.rank : "–"],
         ["Volumen 24 Std.", big(F.vol24)[0], `${big(F.vol24)[1]} ${esc(d.currency)}`], ["Allzeithoch", F.ath ? nf(F.ath, F.ath < 10 ? 4 : 0) : "–", pc(F.ath_change, 0)],
         ["Mayer-Multiple", nf(F.mayer, 2)], ["Performance 1J", pc(F.perf_1y, 0, true)], ["Volatilität 1J", pc(F.vol, 0)]]
      : [["Marktkapitalisierung", big(F.mcap)[0], `${big(F.mcap)[1]} ${esc(d.currency)}`], ["KGV", nf(F.pe, 1), F.fpe ? `fwd ${nf(F.fpe, 1)}` : ""],
       ["EV/EBITDA", nf(F.ev_ebitda, 1)], ["FCF-Rendite", pc(F.fcf_yield)], ["Dividendenrendite", pc(F.div_yield, 2)],
       ["52-Wochen-Spanne", F.lo52 ? `${nf(F.lo52, 0)}–${nf(F.hi52, 0)}` : "–"], ["Volatilität 1J", pc(F.vol, 0), F.beta ? `β ${nf(F.beta, 2)}` : ""]])
      .map(([k, v, s]) => `<div><dt>${k}</dt><dd class="num">${v}${s ? `<small>${s}</small>` : ""}</dd></div>`).join("")}
  </dl>

  ${checklistCard(d)}

  ${fairCard(d)}

  ${valChartCard(d)}

  <h2 class="section">Auf einen Blick</h2>
  <p class="section-sub">Das zutreffendste Adjektiv je Kategorie. Der Balken zeigt die Einordnung von negativ (links) bis positiv (rechts).</p>
  <div class="card overview">
    ${allCats.map(c => `<a class="ov-row" href="#cat-${c.key}">
      <span class="ov-cat">${esc(c.title.replace(/ \(.*\)/, ""))}</span>
      <span class="ov-adj"><span class="dot ${tone(c.score)}"></span>${esc(c.adjective)}</span>
      ${meter(c.score)}
      <span class="ov-w num">${nf(c.weight * 100, 0)} %</span></a>`).join("")}
    <div class="ov-row" style="background:var(--surface-2)">
      <span class="ov-cat"><b style="color:var(--text)">Zusammenfassendes Urteil</b></span>
      <span class="ov-adj"><span class="dot ${gt}"></span>${esc(d.summary.adjective)}</span>
      ${meter(R.score / 100)}<span class="ov-w">100 %</span></div>
  </div>

  <h2 class="section" id="kategorien">Einschätzung im Detail</h2>
  <p class="section-sub">Welche Kennzahlen zu welchem Urteil geführt haben, inklusive aller möglichen Ausprägungen der Kategorie.</p>
  <div class="cats">${allCats.map(c => `
    <article class="card pad cat" id="cat-${c.key}">
      <div class="cat-head">
        <div><div class="eyebrow">${esc(c.title)}</div><div class="cat-adj">${esc(c.adjective)}</div></div>
        ${c.score != null ? `<span class="tone ${tone(c.score)}">${toneText[tone(c.score)]}</span>` : ""}
      </div>
      ${meter(c.score)}
      <div class="meter-l"><span>negativ</span><span>positiv</span></div>
      <ul class="reasons">${c.reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      ${c.options.length ? `<div class="options"><div class="lbl">Mögliche Ausprägungen</div>
        ${c.options.map(o => `<span class="opt ${o === c.adjective ? "sel" : ""}">${esc(o)}</span>`).join("")}</div>` : ""}
      <div class="cat-foot"><span>Teilscore <b class="num">${c.score == null ? "–" : (c.score > 0 ? "+" : "") + nf(c.score * 100, 0)}</b></span>
        <span>Gewicht ${nf(c.weight * 100, 0)} %</span></div>
    </article>`).join("")}
  </div>

  ${peersSection(d)}

  ${analystSection(d)}

  ${healthSection(d)}

  <h2 class="section" id="fundamental">Fundamentaldaten</h2>
  <p class="section-sub">${etf ? "Kosten, Rendite, Risiko und Streuung sowie die Bewertung der enthaltenen Aktien."
    : crypto ? "Markt und Netzwerk, Angebot und Inflation, Marktzyklus, Risiko und Stimmung."
    : "Tier 4: Geschäftsmodell, Bilanz, Kapitalallokation, Bewertung im Vergleich und eingepreiste Erwartungen."}</p>
  <div class="fund">${d.fundamentals.map((s, i) => `
    <div class="card"><h3><span>${i + 1}</span>${esc(s.title)}</h3>
      <div>${s.rows.map(r => `<div class="frow"><div class="fk">${esc(r[0])}${r[2] ? `<div class="fh">${esc(r[2])}</div>` : ""}</div>
        <div class="fv num">${esc(r[1])}</div></div>`).join("")}</div>
    </div>`).join("")}
  </div>

  <h2 class="section" id="news">Nachrichten der letzten 30 Tage</h2>
  <p class="section-sub">${N.count} relevante Meldungen, davon ${N.count_trusted} aus Tier-1/2-Quellen. Punktfarbe = Tonalität der Schlagzeile.</p>
  <div class="card">
    <div class="news-head">
      <div class="seg" id="seg">${["1", "2", "3", "0"].map((t, i) =>
        `<button data-t="${t}" class="${i === 0 ? "on" : ""}">${t === "0" ? "Sonstige" : "Tier " + t}<em>${N.by_tier[t].length}</em></button>`).join("")}</div>
      <div class="sent">Tonalität
        <div class="sent-bar">${(() => { const tot = Math.max(1, N.pos + N.neg); return `<i style="width:${N.pos / tot * 100}%;background:var(--pos)"></i><i style="width:${N.neg / tot * 100}%;background:var(--neg)"></i>`; })()}</div>
        <span class="num">${N.pos} positiv · ${N.neg} negativ</span></div>
    </div>
    <div class="tier-desc" id="tdesc"></div>
    <ul class="nlist" id="nlist"></ul>
    <div class="print-only print-news">${["1", "2", "3"].map(t => N.by_tier[t].length ? `<h4>${esc(N.labels[t])}</h4><ul>
      ${N.by_tier[t].slice(0, 6).map(n => `<li><span class="dot ${n.sentiment > 0 ? "pos" : n.sentiment < 0 ? "neg" : ""}"></span>
        ${esc(n.title)} <span class="stamp">– ${esc(n.source)}, ${esc(n.date)}${n.verified === true ? ", bestätigt" : n.verified === false ? ", unbestätigt" : ""}</span></li>`).join("")}</ul>` : "").join("")}</div>
    <div class="news-foot">Tier-3-Meldungen (Pressemitteilungen, Unternehmensseiten) gelten als <b>bestätigt</b>, wenn eine Tier-1/2-Quelle inhaltlich übereinstimmt. Unbestätigte fließen nur zur Hälfte ein.
      ${N.errors.length ? `<br>Nicht erreichbar: ${esc(N.errors.join(", "))}` : ""}</div>
  </div>

  ${aboutSection(d)}

  <h2 class="section" id="methodik">Methodik</h2>
  <p class="section-sub">So entsteht die Empfehlung. Alle Regeln sind transparent und im Programmcode anpassbar.</p>
  <div class="method">
    <div class="card pad"><h3>Gewichtung</h3>
      <table class="wtable">${allCats.map(c => `<tr><td>${esc(c.title.replace(/ \(.*\)/, ""))}</td><td>${nf(c.weight * 100, 0)} %</td></tr>`).join("")}</table>
    </div>
    <div class="card pad"><h3>Regeln</h3><ul>
      <li>Jede Kategorie erhält einen Teilscore von −100 bis +100 aus mehreren Kennzahlen; daraus folgt das passende Adjektiv.</li>
      ${etf ? `<li>ETF-Modell: Kosten &amp; Struktur (TER, Fondsvolumen, Alter), Bewertung der enthaltenen Aktien (KGV, KBV),
        Rendite p. a. über 3/5/10 Jahre, Risiko und Streuung (Volatilität, Rückgänge, Top-10-Anteil, größte Branche) und Kurstrend.</li>
      <li>Thesaurierende ETFs: Ausschüttung zählt nicht (Erträge stecken in der Rendite).</li>`
      : crypto ? `<li>Bewertung: Mayer-Multiple (Kurs ÷ 200-Tage-Linie), Abstand zum Allzeithoch, Marktwert im Verhältnis zum Handelsvolumen.</li>
      <li>Netzwerk: Rang nach Marktwert, Alter, Liquidität, begrenzte Maximalmenge. Wachstum: 12-Monats-Entwicklung und Verwässerung durch Neuausgabe.</li>
      <li>Risiko ist bei Kryptowährungen grundsätzlich höchstens „neutral“. Coins außerhalb der Top 50: höchstens „Halten“. Stablecoins: immer „Neutral“.</li>
      <li>Stimmung: Crypto Fear &amp; Greed Index und News-Tonalität. Dividende: nicht anwendbar (0 % Gewicht).</li>`
      : `<li>Bewertung: KGV und EV/EBITDA gegen Branche und eigene Historie, FCF-Rendite, PEG, Kursziel und Reverse-DCF.</li>
      <li>Deckel: Bei sehr hoher Bewertung oder schwacher Qualität ist höchstens „Halten“ möglich.</li>
      <li>Branchenmodelle: Banken und Versicherer (Kurs-Buchwert vs. ROE), Immobilien/REITs (Kurs/FFO, Beleihungsquote),
        Wachstum mit Verlusten (EV/Umsatz, Rule of 40, Cash-Reichweite), Vorumsatz-Firmen (höchstens „Market Perform“)
        und Zykliker (normalisiertes KGV, Marge vs. Zyklusmittel).
        Hier angewendet: <b>${esc(d.model?.label || "Standardmodell")}</b>.</li>`}
      <li>News: Tier 1 = 100 %, Tier 2 = 90 %, Tier 3 = 50 % (unbestätigt 25 %), Sonstige = 30 %.</li>
    </ul></div>
    <div class="card pad"><h3>Skala</h3><div class="scale-list num">
      ${R.scale.map((s, i) => `<span>${i === R.scale.length - 1 ? "darunter" : "ab " + (s.min > 0 ? "+" : "") + s.min}</span><span style="${s.label === R.label ? "font-weight:700;color:var(--text)" : ""}">${esc(s.label)}</span>`).join("")}
    </div></div>
  </div>
  <aside class="legal" role="note" aria-label="Rechtlicher Hinweis">
    <div class="legal-icon" aria-hidden="true">!</div>
    <div>
      <b>Automatisierte Kauf- und Verkaufsempfehlung – keine Anlageberatung</b>
      ${crypto ? `<p><b>Kryptowährungen sind hochspekulativ.</b> Sie haben keinen inneren Wert aus Gewinnen oder Vermögen, schwanken extrem
        (Rückgänge von 50–90 % sind mehrfach vorgekommen) und ein <b>Totalverlust</b> ist möglich. Anders als Aktien sind sie nicht durch die
        Einlagensicherung oder ein Sondervermögen geschützt; Börsen und Verwahrer können ausfallen. Investiere nur Geld, dessen Verlust du verkraften kannst.</p>` : ""}
      <p>Die Empfehlung „${esc(R.label)}“ und alle Einschätzungen auf dieser Seite werden vollautomatisch von einem regelbasierten
        Computerprogramm aus öffentlich verfügbaren Daten erzeugt. Kein Mensch hat sie geprüft. Sie stellen <b>keine Anlageberatung</b>,
        keine Finanzanalyse im Sinne des Wertpapierhandelsgesetzes und keine Aufforderung zum Kauf oder Verkauf von Wertpapieren dar.</p>
      <p>Die Daten können verzögert, unvollständig oder fehlerhaft sein. Deine persönliche finanzielle Situation, Ziele und Risikobereitschaft
        werden nicht berücksichtigt. Investitionen in Aktien können zum Verlust des eingesetzten Kapitals führen. Triff Anlageentscheidungen
        eigenverantwortlich und hole bei Bedarf Rat bei einer unabhängigen, zugelassenen Anlageberatung ein.</p>
    </div>
  </aside>`;

  const showTier = t => {
    document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    $("#tdesc").textContent = N.labels[t];
    const items = N.by_tier[t];
    $("#nlist").innerHTML = items.length ? items.map(n => `<li><span class="dot ${n.sentiment > 0 ? "pos" : n.sentiment < 0 ? "neg" : ""}"></span>
      <div><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="nmeta"><span>${esc(n.source)}</span><span>·</span><span>${esc(n.date)}</span>
      ${n.verified === true ? `<span class="badge ok">bestätigt</span>` : n.verified === false ? `<span class="badge no">unbestätigt</span>` : ""}</div></div></li>`).join("")
      : `<li class="empty">Keine Meldungen aus dieser Quellen-Gruppe gefunden.</li>`;
  };
  document.querySelectorAll("#seg button").forEach(b => b.onclick = () => showTier(b.dataset.t));
  showTier("1");
  document.querySelectorAll(".alts button").forEach(b => b.onclick = () => { $("#q").value = b.dataset.s; run(b.dataset.s); });
  initChart(d.symbol);
  initValChart(d);
  initTechCard(d);
  glossarize($("#out"));
  if (!crypto && !etf) initIncome(d.symbol);
  document.querySelectorAll("table.peers tr.peer").forEach(tr => tr.onclick = () => { $("#q").value = tr.dataset.s; run(tr.dataset.s); });
  if ((d.history || []).length >= 2) {
    drawHistory(d);
    let lastW = 0;
    new ResizeObserver(() => { const w = $("#hist-wrap")?.clientWidth; if (w && w !== lastW) { lastW = w; drawHistory(d); } }).observe($("#hist-wrap"));
  }
  $("#alertbtn").onclick = () => openAlert(d.symbol, d);
  $("#pdfbtn").onclick = () => exportPdf(d);
  const wt = $("#wltoggle");
  wt.onclick = () => { const on = wlToggle(d); wt.classList.toggle("on", on); wt.textContent = on ? "★ In der Watchlist" : "☆ Zur Watchlist"; };
  const bm = $("#bizmore");
  if (bm) bm.onclick = () => { const b = $("#biz"); b.classList.toggle("clamp"); bm.textContent = b.classList.contains("clamp") ? "Mehr anzeigen" : "Weniger anzeigen"; };
}

if (location.protocol === "file:") {
  $("#out").innerHTML = `<div class="card error"><b>Bitte über das Startskript öffnen</b>
    <span class="stamp">Diese Datei wurde direkt geöffnet und kann so keine Daten laden. Im Ordner „Aktien-Check“
    die Datei „Aktien-Check starten.bat“ doppelklicken – danach öffnet sich http://localhost:8765. Das schwarze Fenster offen lassen.</span></div>`;
  $("#f").onsubmit = e => e.preventDefault();
} else {
  route();
}
</script>
</body>
</html>
